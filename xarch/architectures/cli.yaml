# A command-line app of modules: each module is a vertical slice; shared technology sits in platform/, commands in cli/.
name: cli
language: python
testing: pytest

parts:
  domain:
    path: modules/<module>/domain
    role: "entities, values (incl. ids), errors: invariants only"
    litmus: >-
      Is it an invariant of one of this module's entities or values (a state transition or a validation) that can run
      with no database and no clock? If yes, it goes here, on that entity or value. An id that names one of the
      module's things is defined here too, in `domain/values.py`, and `contract/` re-exports it; so are the errors
      the module's rules raise, each named for the module's thing; the bases they subclass, which name no module's
      thing, are `kernel/`'s. If it is a value the module hands out as it is, with nothing to reshape, it goes in
      `domain/published.py`, which `contract/` re-exports. If it is a pure rule that is not one entity's invariant,
      it belongs in `application/logic/`. If it must load or save anything, it is a service step. `xarch check` holds
      it to its `forbidden` list: no clock and no I/O by name.
    may_import: [kernel, kernel-logic]
    forbidden: pure
    holds: classes
    no_callbacks: true
    tier: unit

  logic:
    path: modules/<module>/application/logic
    role: pure functions over the module's domain objects, one file per rule
    litmus: >-
      Is it a pure function over this module's domain objects, not one entity's invariant, with no port and no I/O? If
      yes, it goes here, in a file named for the rule. If it holds one entity's invariant, it belongs in that entity
      in `domain/`. If another module needs it too, it belongs in `kernel/logic/`. If it must load or save anything,
      it is a service step. `xarch check` holds it to its `forbidden` list: no clock and no I/O by name.
    may_import: [domain, kernel, kernel-logic]
    forbidden: pure
    holds: functions
    immutable: true
    no_callbacks: true
    tier: unit

  ports:
    path: modules/<module>/application/ports
    role: Protocols for what the module needs from the outside
    litmus: >-
      Is it something the application needs from outside itself (storage, search, email, or another module's rule)
      that can be declared as a `Protocol` with no implementation, in the module's own vocabulary and not in SQL or
      vendor terms? If yes, it goes here. If it is a generic primitive with no business meaning (such as `Clock`), it
      belongs in `kernel/`. If it has a body that talks to a real system, it belongs in `adapters/`. `xarch check`
      holds it to its `forbidden` list: no clock and no I/O by name.
    may_import: [domain, kernel, kernel-logic]
    forbidden: pure
    holds: classes
    tier: integration

  services:
    path: modules/<module>/application/services
    role: "use-case steps: load, check, act, persist; they assemble what the use case hands out"
    litmus: >-
      Does it run one use case as the sequence "load → check preconditions → act → persist → notify", calling ports,
      logic and domain objects, and then assemble what the use case hands out on success (the DTO, or the `Result`
      variant that carries it) from the values they return? If yes, it goes here. If it decides what is valid, it
      belongs in `domain/`. If it is a pure rule with no port, or a decision about what the DTO says (a condition, a
      default, a sentence), it belongs in `application/logic/`, and the service calls it. If it turns a failure into
      a `Result` variant, it belongs in the controller. If it touches a database, it belongs in `adapters/`.
    may_import: [logic, domain, ports, contract, kernel, kernel-logic]
    holds: classes
    names: "*Service"
    forbidden: ambient
    built_by: [bootstrap]
    tier: integration

  controller:
    path: modules/<module>/application/controller.py
    role: maps failures to Result variants
    litmus: >-
      Does it call this module's own services, turn each exception a service raises into the `Result` variant that
      says it, and return what the service assembled on success, without deciding any business rule? If yes, it goes
      here, and no module's error leaves the module past it. When a use case cannot fail, it builds the `Result` from
      the plain values the service returns. If it names argument parsing or terminal output, it belongs in `cli/`. If
      it handles a table row, or reads another module's `Result` to answer one of this module's ports, it belongs in
      `adapters/`.
    may_import: [services, logic, domain, ports, contract, kernel, kernel-logic]
    holds: classes
    names: "*Controller"
    forbidden: ambient
    built_by: [bootstrap]
    tier: integration

  adapters:
    path: modules/<module>/adapters
    role: "driven only: repos, which translate the platform/ table models; use platform/ clients"
    litmus: >-
      Does it implement one of this module's ports against a real system, or against another module's controller (it
      calls that controller and turns the `Result` that comes back into the port's own answer), translating between
      the module's types and theirs, and naming no other module except the `contract/` of one whose controller it
      wraps? If yes, it goes here, and so does the private `Protocol` it declares for the little it calls of what it
      wraps. If it knows no module's types and is only a client or engine for a technology, it belongs in
      `platform/`. If it contains a business rule, it belongs in `domain/`.
    may_import: [ports, domain, kernel, kernel-logic, platform, contract@any]
    must_import: [platform, contract@any]
    built_by: [bootstrap]
    libraries: [sqlmodel]
    forbidden: ambient
    holds: classes
    tier: unit

  platform:
    path: platform
    role: >-
      shared technology clients: llm, embeddings, email, crypto, blob_storage, system clock, sql engine, sessions and
      table models
    litmus: >-
      Is it a client or engine for an external technology (LLM, embeddings, email, crypto, blob storage, the system
      clock that reads the real time, SQL engine, table models) that knows none of the types of any one module? If
      yes, it goes here, named for the technology (a table model, for its table) and never for a module. If it
      translates a module's types for a port, it belongs in that module's `adapters/`.
    may_import: [kernel, kernel-logic]
    libraries: [sqlmodel]
    forbidden: environment
    untested: it wraps outside technology; adapters are tested against a stub of it

  cli:
    path: cli
    role: the only place for commands and terminal output
    litmus: >-
      Does it parse arguments or print to the terminal, whichever module's data it shows, or fetch for a command,
      from the context the command runs in, a controller that was built elsewhere? If yes, it goes here. If it builds
      anything or starts the program, it belongs in `bootstrap/`. If it reports a failure as a `Result`, it belongs
      in the controller. If it holds a business rule, it belongs in `domain/`.
    may_import: [controller@any, contract@any, kernel, kernel-logic]
    libraries: [typer]
    forbidden: environment
    tier: rendering
    folders:
      commands: one file per command group; each calls module controllers

  bootstrap:
    path: bootstrap
    role: "composition root: binds ports to adapters, hands controllers to cli/"
    litmus: >-
      Does it choose which adapter fills which port, build the services and controller around them, wrap one module's
      controller in another's adapter, define the schema, or start the program (read its settings, build the app, run
      it)? If yes, it goes here, and nowhere else. If it builds nothing and only fetches, for a command, a controller
      that was built here, it belongs in `cli/`. If it only implements one module's port against a real system, it
      belongs in `adapters/`.
    may_import: everything
    libraries: [sqlmodel, typer]
    untested: it wires the app and holds no rule; it has no test of its own
    folders:
      migrations: the schema and its history; the only place migrations live

  contract:
    path: modules/<module>/contract
    role: "the module's published language: commands, DTOs, Results (one union per use case), ids"
    litmus: >-
      Is it part of what the module promises to callers outside it: an input a caller sends, an output that comes
      back, or an id that names the module's things? If yes, it goes here; an id is only re-exported here, and the
      line that defines it stays in `domain/values.py`. A value with nothing to reshape may be handed out as it is:
      it is listed, on purpose, in `domain/published.py`, and re-exported here as an id is; everything else the
      module hands out is a type of its own here. If it is a `domain/` entity, a service type or a port, it stays
      where it is, and a DTO goes here instead.
    may_import: ["domain/values:*Id", "domain/published", kernel, kernel-logic]
    forbidden: published
    tier: integration
    package_only: true

  kernel-logic:
    path: kernel/logic
    role: pure functions that modules share, including a rule two modules need
    litmus: >-
      Is it a pure function with no port and no I/O, over `kernel/` primitives or plain values, that two or more
      modules need? If yes, it goes here, in a file named for the rule. If only one module needs it, it belongs in that
      module's `application/logic/`. If it is a value or a type rather than a function, it belongs in `kernel/`. If it
      must load or save anything, it is a service step. `xarch check` holds it to its `forbidden` list: no clock and
      no I/O by name.
    may_import: [kernel]
    forbidden: pure
    holds: functions
    immutable: true
    tier: unit

  kernel:
    path: kernel
    role: "pure primitives: id helpers, base errors, lifecycle fields, tracing, Clock"
    litmus: >-
      Is it a primitive with no business meaning, one that could be lifted unchanged into an unrelated system: a base
      type, a protocol with no body, or a helper that makes a new id (base errors, lifecycle fields, tracing
      carriers, the `Clock` protocol, but no class that implements it)? If yes, it goes here. A function that works a
      result out of its arguments is not a primitive: when two or more modules need it, it goes in `kernel/logic/`.
      If only one module needs it, or it names one module's thing, such as a concrete id like `DocumentId` or an
      error like `DocumentNotFound`, it belongs in the owning module. If it wraps a technology or reads the real
      time, it belongs in `platform/`. `xarch check` holds it to its `forbidden` list: no clock and no I/O by name.
    forbidden: pure
    tier: unit

forbidden:
  pure: [datetime.datetime.now, datetime.datetime.utcnow, datetime.datetime.today, datetime.date.today, time.time,
         time.time_ns, time.monotonic, time.perf_counter, builtins.open, builtins.print, builtins.input, sys.stdin,
         sys.stdout, sys.stderr, os.environ, os.getenv, socket, subprocess, sqlite3, urllib, http, shutil,
         pathlib.Path.cwd, pathlib.Path.absolute, os.getcwd, os.path.abspath, os.path.realpath, pathlib.Path.resolve,
         pathlib.Path.home, pathlib.Path.expanduser, os.path.expanduser, os.getcwdb, os.chdir]
  published: [datetime.datetime.now, datetime.datetime.utcnow, datetime.datetime.today, datetime.date.today,
              time.time, time.time_ns, time.monotonic, time.perf_counter, builtins.open, builtins.print,
              builtins.input, sys.stdin, sys.stdout, sys.stderr, os.environ, os.getenv, socket, subprocess, sqlite3,
              urllib, http, shutil, pathlib.Path.cwd, pathlib.Path.absolute, os.getcwd, os.path.abspath,
              os.path.realpath, pathlib.Path.resolve, pathlib.Path.home, pathlib.Path.expanduser, os.path.expanduser,
              os.getcwdb, os.chdir, typing.Any]
  ambient: [pathlib.Path.cwd, pathlib.Path.absolute, pathlib.Path.resolve, pathlib.Path.home, pathlib.Path.expanduser,
            os.getcwd, os.getcwdb, os.chdir, os.path.abspath, os.path.realpath, os.path.expanduser, .absolute(),
            .resolve(), .expanduser(), .chdir(), os.environ, os.getenv]
  environment: [os.environ, os.getenv]

layers: {application: [domain, contract, logic, ports, services, controller], edge: [platform, adapters]}

tiers:
  unit:
    proves: an invariant, a value rule, a state transition, a pure rule, an adapter's translation
    litmus: >-
      Does it prove a rule, value or transition by building the object and asking it, or by calling a pure function
      from `logic/`, or by handing an adapter a stub client and checking what it translates, with no port in sight? If
      yes, it is a unit test. If it needs a port to get an answer, it is an integration test. If it asserts how a port
      was called, it is testing nothing.
    apply_forbidden: true
    docs:
      may_touch: >-
        nothing: no I/O, no clock (checked by `forbidden` for the pure parts), no fakes; an adapter gets a stub of its
        `platform/` client
      one_file_per: domain object or rule
      cases_from: the invariants in the module doc; a rule's cases are a table of its inputs and its answer
      data: built in the test; a rule's inputs are the columns of its table
      example: tests/modules/documents/application/logic/test_staleness.py
      helpers: [tests/modules/documents/builders.py]

  integration:
    proves: one `Result` variant per path, driven through the controller
    litmus: >-
      Does it drive one use case through its real controller, from the state in `given` with the command in `when`,
      and assert the `Result` in `then`? If yes, it is an integration test. If it asserts what a fake holds instead of
      the `Result`, check first that the `Result` would not already say it. If it asserts how a row is stored or read
      back, it is a unit test of the adapter. If it mocks a repo to assert it was called, fake the repo and assert the
      `Result`.
    docs:
      subject: "`application/controller.py`, with the services behind it"
      may_touch: real controllers only; their ports are `tests/fakes/`, or `Mock(spec=<Port>)` for fire-only ports
      one_file_per: use case
      cases_from: "a Given / When / Then table: a row for every `Result` variant, happy and unhappy"
      data: >-
        the `given` column: the state the fakes start with; a builder per aggregate for the common shape, never a
        shared dataset
      example: tests/modules/documents/application/test_publish.py
      helpers: [tests/modules/documents/application/helpers.py]

  rendering:
    proves: what the terminal output shows for each `Result`; never a business outcome
    litmus: >-
      Does it prove what the terminal output shows for one `Result`, with a fake controller injected, asserting only
      what is shown and never an exit code? If yes, it is a rendering test. If it asserts what the use case did, or
      needs the real controller to mean anything, it is an integration test wearing a screen.
    types_only: [controller]
    docs:
      may_touch: a fake controller, injected; the real controller's class only as a type, never called
      one_file_per: command or page
      cases_from: a table of the `Result` and what is shown, a row for every variant it shows
      data: "none: the `result` column is what the fake controller returns"
      example: tests/cli/test_publish.py
      helpers: [tests/cli/conftest.py]

  guard:
    proves: a rule of the architecture holds
    litmus: >-
      Does it read the source tree and fail on a rule of architecture.md, whatever the app does? If yes, it is a
      guard. If it runs the app, it is not a guard.
    folder: architecture
    may_import: []
    docs:
      subject: the source tree
      may_touch: "`tests/architecture/`"
      one_file_per: project, since one test runs every guard
      cases_from: the guards of section 9
      data: none
      example: tests/architecture/test_rules.py

fakes:
  folder: fakes
  for: [ports]
  prefix: Fake

guards:
  scenario-coverage:
    results: contract
    tier: integration
    suffix: Result
    columns: [given, when, then]
    file: test_{name}.py
  no-comments: {}
  closed-tree: {}
  stand-ins: {}
  no-duplicates: {min_statements: 4}
  no-twins: {min_fields: 3, min_renamed: 3, min_subset: 3}
  dead-code: {untested: true}
  pass-through: {parts: [services, controller, adapters]}
  private-imports: {}

files:
  tests/architecture/test_rules.py: {from: examples/shared/tests/architecture/test_rules.py, pinned: true}
  AGENTS.md: agents.md
  ruff.toml: lint.toml

docs:
  entry: cli
  pages:
    statement.md: {from: docs/statement.md, note: problem statement and use cases}
    domain.md: {from: docs/domain.md, note: domain diagram}
    design.md: {from: docs/design.md, note: design document}
    architecture.md: {from: cli.md, note: this file}
    testing.md: {from: testing.md, note: "how the system is tested: tiers, commands, placement, fakes, guards"}
    requirements.md: docs/requirements.md
    adrs/: {note: architecture decision records}
    adrs/0000-template.md: docs/adr.md
    artifacts/standards/_template.md: docs/standard.md
    artifacts/audits/_template.md: docs/audit.md
    artifacts/taxonomy/_template.md: docs/taxonomy.md
    artifacts/modules/_template.md: docs/module.md
    artifacts/guards/_template.md: {from: docs/guard.md, note: the write-up of a guard the project adds itself}
  naming:
    - {kind: command, where: contract/, pattern: verb and thing, example: PublishDocument}
    - {kind: DTO, where: contract/, pattern: thing and `View`, example: DocumentView}
    - {kind: Result variant, where: contract/, pattern: "the outcome, in one word",
       example: [Published, Missing, Rejected]}
    - {kind: Result union, where: contract/, pattern: verb and `Result`, example: PublishResult}
    - {kind: entity, where: domain/, pattern: the thing, example: Document}
    - {kind: id, where: domain/, pattern: thing and `Id`, example: DocumentId}
    - {kind: domain error, where: domain/, pattern: what went wrong, example: [DocumentNotFound, DocumentIncomplete]}
    - {kind: service, where: application/services/, pattern: thing and `Service`, example: DocumentService}
    - {kind: pure rule, where: [application/logic/, kernel/logic/],
       pattern: "a file named for the rule, a function for what it answers", example: [staleness.py, is_stale]}
    - {kind: controller, where: application/, pattern: thing and `Controller`, example: DocumentController}
    - {kind: port, where: application/ports/, pattern: "what the application needs, in its own words",
       example: [DocumentRepo, ContentReview]}
    - {kind: adapter, where: adapters/, pattern: "`<System><PortName>`",
       example: [DbDocumentRepo, ModerationContentReview]}
    - {kind: table model, where: platform/sql/tables/, pattern: thing and `Row`, example: DocumentRow}
    - {kind: test fake, where: tests/fakes/, pattern: "`Fake` and the port's name", example: FakeDocumentRepo}
  examples: [examples/shared, examples/cli]
  example_notes:
    modules/documents/application/ports/content_review.py: documents' own words, no other module named
    modules/documents/adapters/moderation_content_review.py: the only file that names moderation
    modules/documents/contract/__init__.py: the public names; what is not listed here is not part of the contract
    modules/documents/domain/errors.py: each module subclasses the kernel's base errors
    kernel/logic/text.py: a pure function two modules need
    platform/sql/tables/documents.py: columns only, no module's types
    cli/dependencies.py: how a command reaches its controller
    bootstrap/main.py: the script that starts the program
    tests/modules/documents/application/test_publish.py: its table is in section 5.2
    tests/architecture/test_rules.py: written by `xarch init`
