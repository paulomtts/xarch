# The keys of a profile file as `xarch profile explain` says them. keys: by each key's address in the file,
# what it means (a few words), what it accepts and what that does, and an example: a fragment of a profile that loads
# once merged into the smallest one; a guard's accepts is its parameters and what it checks. smallest: the smallest
# valid profile; symbols: what a profile writes in paths and imports, each with what it means. fragments: pieces of
# profile an example shares: a line that is exactly <<name>> stands for that fragment's text. A word written %word% is
# said in the words of the language (%extension%, %interface%, ...), and %min_statements% and %min_fields% are the
# defaults of no-duplicates and no-twins. Which keys exist, where they sit and what they enforce is xarch's own table;
# this file holds a text for each of them, and no other. slots: the same, for each slot of an eval of the profile's
# own, written under an id of its own.
fragments:
  part: |
    parts:
      documents/:
        role: the documents
  two: |
    parts:
      core/:
        role: the rules of the documents
      documents/:
        role: the documents
        imports:
          may: [parts.core]
  tiered-part: |
    <<part>>
        tests: unit
  testing: |
    testing:
      files: [check_*%extension%]
      declared:
        - function: "check_*"
  table: |2
      tables:
        - decorator: checks.cases
          columns_from: {position: 0, keyword: names}
          rows: {position: 1, keyword: cases}
          row: checks.case
          id: {keyword: id}
  mocks: |2
        calls: [doubles.make]
        specs: [{keyword: spec}]
  fakes: |
    fakes:
      folder: fakes
      for: [core]
      prefix: Fake
  coverage: |
    <<testing>>
    <<table>>
    tiers:
      integration:
        proves: a use case
    parts:
      units/<unit>/:
        documents/:
          role: the documents
          tests: integration
        results/:
          role: the result unions
          tests: integration
  coverage-guard: |
    <<coverage>>
    guards:
      scenario-coverage:
        results: results
        tier: integration
        suffix: Result
        columns: [given, when, then]
        file: check_{name:snake}%extension%
  check: |
    checks:
      no-todo:
        read: comment
        in: {where: [placed]}
        may_not: {text: ["*TODO*"]}
        message: "{file} leaves a note for later at line {line}: {text}"
        fix: "do it now, or write it where the team tracks its work"
        examples:
          flagged: {documents/notes%extension%: "%comment% TODO: split this file\n"}
          clean: {documents/notes%extension%: "%comment% split by kind\n"}
  pages: |
    docs:
      pages:
        statement.md:
          from: docs/statement.md
          note: the problem the documents solve
  eval: |
    evals:
      title-rule:
        ask: Does this file itself test the document's title to decide whether the document may change?
        answer: yes-no
        yes: the file tests the title itself to decide
        no: the file asks the document, which decides
        reads: file
        in: {part: documents}
        keep: [not package-file]
        message: "{file} may decide a rule of the document itself ({value})"
        fix: "read it against the litmus of documents/: if the rule is the document's own, move it onto the document"
    <<eval-examples>>
  eval-examples: |2
        examples:
          flagged:
            documents/publish%extension%: "%comment% refuses to publish when the title is empty\n"
            documents/rename%extension%: "%comment% refuses an empty title once the document is published\n"
          clean:
            documents/publish%extension%: "%comment% asks the document to publish itself\n"
            documents/rename%extension%: "%comment% asks the document to take the new title\n"
smallest: |
  name: documents-app
  parts:
    documents/:
      role: the documents
symbols:
  "<folder>/": "under parts, a key ending in /: a folder, holding the folders, files and keys of what lies in it"
  "<word>/": "under parts: a repeating folder, one per name, as in units/<unit>/; there may be several"
  parts.store: "in imports: that part in every instance of its repeating folder, or the part itself outside one"
  unit.store: "in imports: that part in the importer's own instance of its repeating folder, units/<unit>/"
  parts.store/schema: only what lies below that path of the part
  parts.store:*Id: "in imports.may, after `:`: only the names that match the pattern, `*` for any text"
  everything: "in imports.may or imports.libraries: no limit"
  "<file>%extension%": "under parts, a key holding a dot: a file, always a part"
keys:
  name:
    meaning: what the profile is called
    accepts: a non-empty string
    example: "name: documents-app"
  based_on:
    meaning: "the profile this one is based on: a bundled one, or a profile file"
    accepts: >-
      the name of a bundled profile, or the path of a profile file from this file's folder: `profile check` and
      `check` compare this one with it, unless `--against` names another for the run; `--strict` rests on a bundled
      profile: the chain's bundled root, else the bundled profile closest to its last file
    example: "based_on: <bundled>"
  language:
    meaning: the language of the app
    accepts: >-
      the name of a language xarch ships, read from its data file: the ending of a source file, the package file, what
      marks an interface, the names bound without an import and the standard library; the first by name is the default
    example: "language: <language>"
  testing:
    meaning: how the test framework names things
    accepts: >-
      a preset name, a map {preset, beside} naming one, or a map {files, declared, globals, skips, tables, mocks,
      beside}; needed with `tiers` and the guards scenario-coverage and stand-ins. Dotted names are what an import
      binds; what stays %language% is `%interface_path%` as the mark of a port, `%package_file%`, the syntax tree,
      import resolution and the standard library's names
    example: |-
      testing:
        files: [check_*%extension%]
        declared:
          - function: "check_*"
  parts:
    meaning: the folder tree of the app, and its parts
    accepts: >-
      the folder tree below the app: a key ending in `/` is a folder of one or more steps (`modules/<module>/`), a key
      holding a dot is a file, and any other key is a key of the part the folder or file is. A folder with a `role` is
      a part, one with another key of a part and no `role` is refused, and one with neither is only a folder, whose
      value may be one line of text, its note; a file is always a part. A part is named by its folder's last step or
      its file's name before the first dot, or by `name:`; two parts of one name are refused. A part may lie inside
      another, and a file belongs to the deepest part around it. The parts' reading order, top to bottom and a part
      before the parts inside it, is the order their litmus tests run
    example: |
      <<two>>
  never:
    meaning: named lists of names a part never uses
    accepts: >-
      a map {<list>: [<dotted name> | <list>, ...]}; a part points to one list with `uses: {never: <list>}`. An entry
      is a dotted name as an import binds it (`datetime.datetime.now`; a builtin as `%namespace%.open`, a bare `open`
      is refused), a whole package (`socket`), or a method written with a leading dot and parentheses (`.absolute()`).
      An entry that is exactly the name of another list of `never` includes that list's names in its place, in order,
      however deep, and the list may be written below; a list may not include itself, nor reach a name or a list
      twice. A list may not take the name of a package of the %language% standard library, nor of a package the
      profile names in a part's `imports.libraries` or in `reserved`, since an entry of that name would name the list. A file
      may not import a listed package or anything below it, nor use a listed name, called or not, as the file writes
      it (through the import that binds it, or a builtin by its bare name where nothing shadows it), nor call a listed
      method on anything no import names (a variable, a parameter, the result of a call), but on the method's own
      object and what it holds (`self.paths.resolve()`: a port's or its own). A method entry matches any object with a
      method of that name, so it belongs only in a list of parts that never call one legitimately. Silent on a name
      reached through a variable or `getattr`, a method of an object the list does not name, an annotation, and what a
      helper in another file does: a ban list, not a proof of purity. Not `review.never`, the files review never
      sends, which is another list
    example: |
      never:
        pure: [time.time, socket]
        published: [pure, json.dumps]
        ambient: [pathlib.Path.cwd, .absolute()]
      <<part>>
          uses: {never: published}
  reserved:
    meaning: standard-library names only some parts may import
    accepts: >-
      a map {<name>: <reason>}: a top-level import name of the %language% standard library, and why; the `libraries`
      check reads it as an outside package, so a file of a part imports it only when the part's `imports.libraries` lists it (or
      is everything), and the violation says the reason. Tests are not checked
    example: |
      reserved:
        json: only the store reads files
      <<part>>
          imports:
            libraries: [json]
  layers:
    meaning: chains of parts from the inside out
    accepts: >-
      a map {<name>: [<part>, ...]}: no part imports one after it in its chain; refused at load when an `imports.may`
      breaks a chain
    example: |
      layers:
        stack: [core, documents]
      <<two>>
  tiers:
    meaning: the kinds of test, in the order their litmus tests run
    accepts: >-
      a map {<tier>: {...}}; with tiers, every part names the tier that `tests` it or says why it is `untested`;
      needs `testing`.
      Tests mirror the app: tests/<path> for the app's <path>, and a test file has the tier of the part its folder
      mirrors (a folder that mirrors no part belongs to the tier whose `folder` holds it). A test imports only the part
      its folder mirrors and what that may import, a `<word>.<part>` reference meaning the instance it mirrors, then what its tier's
      `imports.also` adds, and other test code only from its own folder; a test in no tier is a violation. Every folder below tests/<a repeating folder>/ mirrors a
      folder of the app
    example: |
      <<testing>>
      tiers:
        unit:
          proves: a rule of the documents
      <<tiered-part>>
  fakes:
    meaning: the folder of the test fakes, and what they stand in for
    accepts: a map {folder, for, prefix}
    example: |
      <<two>>
      <<fakes>>
  guards:
    meaning: the pre-built checks in use
    accepts: >-
      a map {<guard>: {...}}: a guard left out is off; `xarch profile explain guards.<guard>` says what one checks
    example: |
      guards:
        no-comments: {}
        no-duplicates: {min_statements: 6}
  excluded:
    meaning: folders below the app that are not its source
    accepts: >-
      a map {<folder>: <reason>}: a path below the app, never a folder of the layout; no check reads a %language% file
      below one (`closed-tree` and the `ungoverned` list leave it out); `check` lists each under `enforcement` and
      `where` says so; not a finding for `--strict`
    example: |
      excluded:
        generated: written by a tool, not by hand
  hints:
    meaning: your own advice for a rule
    accepts: >-
      a map {<rule id>: <text>}: shown after the built-in fix of a violation of that rule, as a `hint:` line in the text
      output and `hint` in the JSON; an id that is no rule of `check` is refused when the profile loads
    example: |
      hints:
        may-import: Ask the maintainer before adding an import.
  checks:
    meaning: checks of your own, beside the keys
    accepts: >-
      a map {<id>: <check>}: an id of your own (lowercase words joined by `-`, none of a check xarch has), and a check
      written in the words of the engine: what it reads (`read`), where (`in`), what it keeps, what must or may not hold
      of it, what excuses it, and its `message` and `fix`; with `examples`, code it must find something in and code it
      must find nothing in, which `profile check` runs. `xarch profile explain checks` says how a check is written and
      every word it is written in; `xarch profile explain <key> --rule` shows the rules a key expands to, written as
      checks. A check that reads nothing in the project is listed under `enforcement`, and fails `check --strict`
    example: |
      <<part>>
      <<check>>
  files:
    meaning: the files `init` writes besides the docs
    accepts: "a map {<path>: <from> or {from, pinned, fill}}: `from` is a file or folder next to the profile"
    example: |
      files:
        AGENTS.md: agents.md
  docs:
    meaning: everything that only fills the generated docs
    accepts: a map {entry, pages, naming, examples, example_notes}
    example: |
      docs:
        entry: documents
  review:
    meaning: "what `xarch review` may send: never, mask"
    accepts: >-
      a map {never, mask}: the files review never sends, and the texts it hides in the others before it sends; `check`
      never acts on it: a value written wrong makes the profile invalid for every command, `check` included, and no
      finding and no exit code of `check` depends on what it says. Neither key can switch sending on: the key
      of the decision model's service, set in the environment, alone does that
    example: |
      review:
        never: [documents/drafts]
        mask: [Northwind]
  evals:
    meaning: "what `xarch review` asks: placement, and evals of your own"
    accepts: >-
      a map of the evals review asks, by id: `placement`, the eval review always asks (which part a file belongs in,
      by the parts' litmus tests), whose `lines` and `alike` it tunes; and under any other id of your own (lowercase words joined
      by `-`) an eval of the profile's own, a map of slots: `ask` the question, `answer` its form, `yes` and `no` what
      each answer means (yes-no only), `reads` what one question is asked of, `in` the files it is asked in, `keep` the
      filters a file, class or function must pass, `line` the value from which a reading is listed, `message` and `fix` what
      is said of one, and `examples`. Write one rule per question, about what the text shows. An eval of your own runs
      only once `xarch review calibrate` has held it to its examples with the model review asks, and only while it
      stays as it was then. `check` never acts on `evals`: a value written wrong makes the profile invalid for every
      command, `check` included, and no finding and no exit code of `check` depends on what it says (its enforcement
      lists a line set lower than the bundled profile's as looser, for information only)
    example: |
      evals:
        placement:
          lines: {documents: 0.2}
  parts.<part>.name:
    meaning: the part's name, when its folder or file does not give it
    accepts: >-
      a name of letters, digits, `_` and `-`: the part is called this instead of its folder's last step or its file's
      name before the first dot; needed when two parts would take one name, and every other key names the part by it
    example: |
      parts:
        kernel/:
          role: the bases every module shares
          logic/:
            name: kernel-logic
            role: the pure rules every module shares
  parts.<part>.role:
    meaning: what the part is for, in one line
    accepts: "one line of text: the note of its folder in the docs tree"
    example: |
      <<part>>
          role: saves and loads documents
  parts.<part>.litmus:
    meaning: the question that tells code belongs here
    accepts: >-
      text, ideally a yes-or-no question. A part the bundled profile this one is compared with gives a litmus, redefined
      here without one, is listed as looser, and fails `check --strict`
    example: |
      <<part>>
          litmus: Does it save or load a document?
  parts.<part>.imports:
    meaning: what the part may and must import, and its outside packages
    accepts: >-
      a map {may, must, libraries}, at least one of them, in any order: `may` the targets the part may import besides
      itself, `must` those each of its files imports one of, `libraries` the outside packages it may import. Without
      `imports`, or without `may`, the part imports only itself; without `libraries`, no outside package. `never`
      belongs to `uses`, beside `imports`
    example: |
      <<two>>
  parts.<part>.imports.may:
    meaning: what the part may import besides itself
    accepts: >-
      [parts.<part>, <word>.<part>, ...] or everything, each reference optionally followed by `/<path>` and
      `:<pattern>`, or one marked {<reference>: types_only}: `parts.<part>` is that part in every instance of its
      repeating folder, or the part itself outside one; `<word>.<part>` the part in the importer's own instance of the
      folder the word repeats, which the importer lies in too; `/<path>` only what lies below it, `:<pattern>` only the
      names that match the pattern (`*` for any text, such as `parts.core/ids:*Id`): `from <there> import <name>` for
      each name, never the file as a whole, and a file of the tests is not narrowed; an entry written
      `{<reference>: types_only}` is a target the part may import only to use as a type (imports.may.types_only); a
      part may always import itself, so a target that only says so is refused
    example: |
      <<two>>
  parts.<part>.imports.may.types_only:
    meaning: a target of imports.may the part may use only as a type
    accepts: >-
      the mode of an entry of `imports.may`, written `{<reference>: types_only}`, one reference per entry, such as
      `[{parts.core: types_only}]`: a file of the part may import what the entry reaches to annotate, and for
      `isinstance` and exception matching, but never call what it imports from there (`X(...)`, `m.X(...)`,
      `X.build(...)`) nor reference one of its top-level functions at all, read through every import, however written.
      The rule reads what the entry reaches, its part, instance and path; its name pattern narrows only what may be
      imported. A tier's `imports.types_only` is the list form of the same idea, read on a test
    example: |
      parts:
        core/:
          role: the rules of the documents
        documents/:
          role: the documents
          imports:
            may: [{parts.core: types_only}]
  parts.<part>.imports.must:
    meaning: what each file of the part has to reach
    accepts: >-
      [<reference>, ...] written as `imports.may` writes them, with no mode, each an entry of `imports.may`: each file
      imports one of them, or an outside package (top-level, neither standard library nor the app's own, whatever
      `imports.libraries` says), or imports a file of its own part that does, however far the chain; files that only
      import each other meet nothing. Exempt: `%package_file%` and a file with no function or method holding a real
      statement (types, constants, %interface% stubs). A failing file is reported once, as a whole
    example: |
      <<two>>
            must: [parts.core]
  parts.<part>.imports.libraries:
    meaning: the outside packages the part may import
    accepts: >-
      [<package>, ...] by top-level name, or everything; none by default; the standard library is always allowed, but
      for a name `reserved` holds, which a part lists here to import it; tests are not checked
    example: |
      <<part>>
          imports:
            libraries: [yaml]
  parts.<part>.holds:
    meaning: what the files of the part define at the top level
    accepts: >-
      a map of kinds, {classes, functions, records, exceptions}, each `{}` or its settings: a kind listed may exist at
      the top level of a file of the part, a kind not listed may not; without `holds` the part may hold every kind.
      `classes` covers every class, records and exceptions included; `records` and `exceptions` are narrower, and a
      class is held to the settings of the narrowest kind listed that it fits, in the order exceptions, records,
      classes, and to no other's. Beside `classes`, `records` or `exceptions` is written only with a setting. A
      public function at the top level (one the language's reader says other files may use) is listed when
      `functions` is not, and a class (a private one too) when `classes` is not and no narrower kind listed fits it. A package file (`%package_file%`) is exempt. Each one is
      listed as `weak` in the enforcement section, and fails `check --strict` only. A kind the language does not
      supply cannot be listed; in a language without `function.top_level`, a part that does not list `functions`
      reads no functions, which `profile explain` and the enforcement section say
    example: |
      <<part>>
          holds: {classes: {}}
  parts.<part>.holds.classes:
    meaning: every class defined at the top level of a file
    accepts: >-
      `{}` or its settings, {names, immutable, built_by}: a class of any name, records and exceptions included, may be
      defined at the top level of a file of the part. With `records` or `exceptions` listed beside it, a class that is
      one is held to that kind's settings, not to these
    example: |
      <<part>>
          holds: {classes: {}}
  parts.<part>.holds.classes.names:
    meaning: how the classes of the part are named
    accepts: >-
      a pattern, or a list of them, with `*` for any text: every public class (one the language's reader says other
      files may use) defined at the top level in a file of the part, held to `classes`, matches one of them
    example: |
      <<part>>
          holds: {classes: {names: "*Store"}}
  parts.<part>.holds.classes.immutable:
    meaning: the classes of the part are immutable records
    accepts: >-
      true: every class held to `classes` that a file of the part defines at the top level, whatever its name, is an
      immutable record, as the language's data file says one is made (its `immutable`: a base, or a decorator called
      with its keywords), but for an exception class. A package file (`%package_file%`) is exempt. Each other one is
      listed as `weak` in the enforcement section, and fails `check --strict` only
    example: |
      <<part>>
          holds: {classes: {immutable: true}}
  parts.<part>.holds.classes.built_by:
    meaning: the only parts that may build its classes
    accepts: >-
      [<part>, ...]: only code of those parts calls the constructor of a class held to `classes` defined at the top
      level in a file of this part, `X(...)` or `m.X(...)`, read through every import, however written; code of this
      part counts as any other, and tests are not read. Silent on a class reached through a package file that
      re-exports it, built in its own file, or built through a variable or a parameter
    example: |
      <<two>>
          holds: {classes: {built_by: [core]}}
  parts.<part>.holds.functions:
    meaning: every public function defined at the top level of a file
    accepts: >-
      `{}` or its settings, {names}: a public function defined at the top level of a file of the part, in no class,
      may exist there; a method is not one (it belongs to its class), nor is the kind `function` of a check of your
      own, which includes methods
    example: |
      <<part>>
          holds: {functions: {}, records: {}, exceptions: {}}
  parts.<part>.holds.functions.names:
    meaning: how the functions of the part are named
    accepts: >-
      a pattern, or a list of them, with `*` for any text: every public function defined at the top level in a file of
      the part, in no class, matches one of them
    example: |
      <<part>>
          holds: {functions: {names: "is_*"}}
  parts.<part>.holds.records:
    meaning: a record, a class that holds values
    accepts: >-
      `{}` or its settings, {names, immutable}: a record may be defined at the top level of a file of the part: a class
      with no method of its own, dunder methods aside, that a top-level function of the same file names in its return
      annotation, as the language's reader reports it
    example: |
      <<part>>
          holds: {functions: {}, records: {}, exceptions: {}}
  parts.<part>.holds.records.names:
    meaning: how the records of the part are named
    accepts: >-
      a pattern, or a list of them, with `*` for any text: every public record held to `records` defined at the top
      level in a file of the part matches one of them
    example: |
      <<part>>
          holds: {records: {names: "*Found"}}
  parts.<part>.holds.records.immutable:
    meaning: the records of the part are immutable records
    accepts: >-
      true: every record held to `records` that a file of the part defines at the top level is an immutable record, as
      the language's data file says one is made (its `immutable`: a base, or a decorator called with its keywords). A
      package file (`%package_file%`) is exempt. Each other one is listed as `weak` in the enforcement section, and
      fails `check --strict` only. Beside `functions`, it keeps the records a part of functions returns from being
      changed by the code they are handed to
    example: |
      <<part>>
          holds: {functions: {}, records: {immutable: true}, exceptions: {}}
  parts.<part>.holds.exceptions:
    meaning: an exception class
    accepts: >-
      `{}` or its settings, {names}: an exception may be defined at the top level of a file of the part: a class that
      derives from a builtin exception, directly or through classes of the app
    example: |
      <<part>>
          holds: {functions: {}, records: {}, exceptions: {}}
  parts.<part>.holds.exceptions.names:
    meaning: how the exceptions of the part are named
    accepts: >-
      a pattern, or a list of them, with `*` for any text: every public exception defined at the top level in a file of
      the part matches one of them
    example: |
      <<part>>
          holds: {exceptions: {names: "*Error"}}
  parts.<part>.shared:
    meaning: the part is there to be shared, by at least this many users
    accepts: >-
      a whole number, at least 2: every public name a file of the part defines at the top level (a class, a function, a
      name an assignment binds) is used by at least this many users, or it is reported where it is defined. A user is
      the instance of a repeating folder a using file lies in, or the part of one outside them; the tests, a file in no
      part, a file of a part that is shared itself and the part's own place do not count. A file uses a name when it
      imports it and mentions it again, or reads it through an import of its file; an import it never mentions again is
      a re-export, and who imports the name from there uses it. A name another name of a shared part mentions (a field's
      type, a helper a function calls) has that name's users too. A name with one user belongs to that user
    example: |
      <<two>>
          shared: 2
  parts.<part>.uses:
    meaning: what the part's code uses
    accepts: "a map {never}: `never` names the list under the top-level `never` of what the part's code never uses"
    example: |
      never:
        pure: [time.time, socket]
      <<part>>
          uses: {never: pure}
  parts.<part>.tests:
    meaning: the tier whose tests cover the part
    accepts: the name of a tier; one tier per part; with `tiers`, a part names the tier that `tests` it or is `untested`
    example: |
      <<testing>>
      tiers:
        unit: {}
      <<tiered-part>>
  parts.<part>.untested:
    meaning: why no tier tests the part
    accepts: one line of text
    example: |
      <<part>>
          untested: it only wires the app
  parts.<part>.package_only:
    meaning: the part is imported only as a package
    accepts: "true: from outside the part, import the package, never one of its files"
    example: |
      <<part>>
          package_only: true
  parts.<part>.uses.never:
    meaning: the list of names the part never uses
    accepts: >-
      the name of one list under the top-level `never`: no file of the part uses a name the list holds, by an import or
      in its code, a module, a dotted name or a method; the built-in form of a check `may_not` over names used. It names
      code, not the parts the part may import, which `imports.may` says
    example: |
      never:
        pure: [time.time, socket]
      <<part>>
          uses: {never: pure}
  tiers.<tier>.proves:
    meaning: what its tests prove, in one line
    accepts: one line of text
    example: |
      <<testing>>
      tiers:
        unit:
          proves: a rule of the documents
      <<tiered-part>>
  tiers.<tier>.litmus:
    meaning: the question that tells a test belongs to the tier
    accepts: text, ideally a yes-or-no question
    example: |
      <<testing>>
      tiers:
        unit:
          litmus: Does it call one rule directly and check its answer?
      <<tiered-part>>
  tiers.<tier>.uses:
    meaning: what its tests keep to of the part they mirror
    accepts: "a map {apply_never}: `apply_never: true` holds its tests to the `uses.never` list of the part they mirror"
    example: |
      <<testing>>
      tiers:
        unit:
          uses: {apply_never: true}
      <<tiered-part>>
  tiers.<tier>.plain_tables:
    meaning: its table tests hold no branch
    accepts: >-
      true: no test of the tier that holds a table of cases (as `testing.tables` writes one) holds, in its body,
      a statement that branches (the language's `branching`) or an expression that chooses between values (its
      `branching_expressions`), as scenario-coverage holds the tables of a use case: the odd case is a test of its own;
      refused when `testing.tables` writes no form
    example: |
      <<testing>>
      <<table>>
      tiers:
        unit:
          plain_tables: true
      <<tiered-part>>
  tiers.<tier>.folder:
    meaning: a folder of tests that mirror no part
    accepts: a folder below the tests folder, for a tier whose tests mirror no part of the app
    example: |
      <<testing>>
      tiers:
        unit: {}
        guard:
          folder: architecture
      <<tiered-part>>
  tiers.<tier>.imports:
    meaning: what its tests may, may also, must import, or import only as types
    accepts: >-
      a map {may, also, must, types_only}, at least one of them, in any order: `may` what the tests in its folder may
      import of the app (only for a tier with a `folder`), `also` what its tests may import besides, `must` the parts
      (`parts.<part>`) one of which each of its test files reaches, `types_only` the parts (`parts.<part>`) its tests
      may import only as types. Without `imports`, a test imports what the part it mirrors may, and a test of the
      tier's folder nothing of the app
    example: |
      <<testing>>
      tiers:
        unit:
          imports:
            must: [parts.documents]
      <<tiered-part>>
  tiers.<tier>.docs:
    meaning: what only fills the generated docs
    accepts: a map {subject, may_touch, one_file_per, cases_from, data, example, helpers}
    example: |
      <<testing>>
      tiers:
        unit:
          docs:
            may_touch: temporary folders
      <<tiered-part>>
  tiers.<tier>.docs.subject:
    meaning: the Subject cell, in place of the parts of the tier
    accepts: one line of text
    example: |
      <<testing>>
      tiers:
        unit:
          docs:
            subject: the documents
      <<tiered-part>>
  tiers.<tier>.docs.may_touch:
    meaning: what its tests may touch
    accepts: one line of text
    example: |
      <<testing>>
      tiers:
        unit:
          docs:
            may_touch: temporary folders
      <<tiered-part>>
  tiers.<tier>.docs.one_file_per:
    meaning: what one test file covers
    accepts: one line of text
    example: |
      <<testing>>
      tiers:
        unit:
          docs:
            one_file_per: use case
      <<tiered-part>>
  tiers.<tier>.docs.cases_from:
    meaning: where its cases come from
    accepts: one line of text
    example: |
      <<testing>>
      tiers:
        unit:
          docs:
            cases_from: the rule's branches
      <<tiered-part>>
  tiers.<tier>.docs.data:
    meaning: where its test data comes from
    accepts: one line of text
    example: |
      <<testing>>
      tiers:
        unit:
          docs:
            data: built in the test
      <<tiered-part>>
  tiers.<tier>.docs.example:
    meaning: its example test
    accepts: a path in an example project listed in `docs.examples`
    example: |
      docs:
        examples: [examples]
      <<testing>>
      tiers:
        unit:
          docs:
            example: tests/documents/check_documents%extension%
      <<tiered-part>>
  tiers.<tier>.docs.helpers:
    meaning: the files its tests share
    accepts: "[<path in an example project>, ...]"
    example: |
      docs:
        examples: [examples]
      <<testing>>
      tiers:
        unit:
          docs:
            helpers: [tests/documents/builders%extension%]
      <<tiered-part>>
  tiers.<tier>.uses.apply_never:
    meaning: its tests keep to the never list of the part they mirror
    accepts: >-
      true or false, a switch and not a list: true holds the tier's tests to the `uses.never` list of the part they
      mirror (it applies the part's never list to them as well; it does not read as "never apply"); false is the same as
      leaving it out
    example: |
      <<testing>>
      tiers:
        unit:
          uses: {apply_never: true}
      <<tiered-part>>
  tiers.<tier>.imports.may:
    meaning: what the tests in its folder may import of the app
    accepts: as a part's `imports.may`, with no mode; only for a tier with a `folder`
    example: |
      <<testing>>
      tiers:
        unit: {}
        guard:
          folder: architecture
          imports:
            may: everything
      <<tiered-part>>
  tiers.<tier>.imports.also:
    meaning: what its tests may also import of the app
    accepts: >-
      references, as a part's `imports.may`, `<word>.<part>` the instance a test mirrors, and added to what each
      test of the tier may import of the app, such as the values a test builds its fakes' answers with; not
      `everything`. A target the bundled profile's tier does not give is listed by `profile check` as looser
    example: |
      <<testing>>
      tiers:
        unit:
          imports:
            also: [parts.core]
      parts:
        core/:
          role: the rules of the documents
          tests: unit
        documents/:
          role: the documents
          tests: unit
  tiers.<tier>.imports.must:
    meaning: what each of its test files has to reach
    accepts: >-
      [parts.<part>, ...]: each test file of the tier (a file whose name `testing.files` matches) imports from one of
      those parts, in any instance, or imports test code that is no test file and does, however far the chain goes; a
      test file with no function holding a real statement is exempt, and a file failing is reported once, as a whole.
      A tier's tests lie in no instance, so `<word>.<part>` is refused here. Silent on what a test is handed without
      importing it, such as a fixture
    example: |
      <<testing>>
      tiers:
        unit:
          imports:
            must: [parts.documents]
      <<tiered-part>>
  tiers.<tier>.imports.types_only:
    meaning: the parts its tests may import only as types
    accepts: >-
      [parts.<part>, ...]: a test may import them to annotate, never to call: `def build(c: Controller)` is fine,
      `Controller(...)` is not; a plain function of such a part may not be referenced at all, while `isinstance`,
      exception matching and enum members stay allowed
    example: |
      <<testing>>
      tiers:
        unit:
          imports:
            types_only: [parts.documents]
      <<tiered-part>>
  testing.preset:
    meaning: the preset the framework is read from
    accepts: >-
      the name of a preset xarch ships: every key of the framework then comes from it, and one written beside it is
      refused; `testing: <preset>` is its short form
    example: "testing: {preset: <preset>}"
  testing.beside:
    meaning: whether every test of a part sits beside the code it tests
    accepts: >-
      `true` or `false` (default false); under true, a file of the app whose name `files` matches is a test of the
      tier its part names, a tier with a `folder` keeps its tests below the tests root, and a part may not name such a
      tier; it is written beside `preset`, or in the whole map, never in a preset
    example: |
      <<testing>>
        beside: true
      tiers:
        unit:
          proves: a rule
      <<tiered-part>>
  testing.files:
    meaning: patterns of a test file's name
    accepts: a list of %extension% names with `*` for any text; required unless `preset` is written
    example: |
      <<testing>>
  testing.declared:
    meaning: the forms a test is declared in
    accepts: >-
      a non-empty list of forms, each {function: <pattern>}, a function whose name matches the pattern (`*` for any
      text), or {call: [<dotted name>, ...], title, body}, a call whose arguments hold the test's title and its body;
      a test is of the first form it matches, and an entry's problem names it by its index, testing.declared.0.call;
      required unless `preset` is written
    example: |
      <<testing>>
  testing.declared[].function:
    meaning: a function whose name matches is a test
    accepts: a name with `*` for any text; takes neither title nor body
    example: |
      <<testing>>
  testing.declared[].call:
    meaning: the calls that declare a test
    accepts: >-
      a list of dotted names, or of names the framework binds without an import (`globals`), each a call whose
      arguments hold the test's title and its body; needs title and body
    example: |
      testing:
        files: [check_*%extension%]
        declared:
          - call: [checks.test]
            title: {position: 0}
            body: {position: 1}
  testing.declared[].title:
    meaning: where the title of a test a call declares is
    accepts: >-
      {position: <n>, keyword: <name>} of the call's arguments, at least one of them; needed with call, refused with
      function
    example: |
      testing:
        files: [check_*%extension%]
        declared:
          - call: [checks.test]
            title: {position: 0}
            body: {position: 1}
  testing.declared[].body:
    meaning: where the body of a test a call declares is
    accepts: >-
      {position: <n>, keyword: <name>} of the call's arguments, at least one of them; needed with call, refused with
      function
    example: |
      testing:
        files: [check_*%extension%]
        declared:
          - call: [checks.test]
            title: {position: 0}
            body: {position: 1}
  testing.globals:
    meaning: the names the framework binds without an import
    accepts: >-
      a list of names or dotted names: a use or a call of one that the file does not bind is read as that name, never
      as one of the language's predefined names; left out: none
    example: |
      <<testing>>
        globals: [expect]
  testing.skips:
    meaning: what skips a test or expects it to fail
    accepts: "dotted names: `check` counts each use under `enforcement`"
    example: |
      <<testing>>
        skips: [checks.skip, checks.expect_fail]
  testing.mocks:
    meaning: how a mock is built
    accepts: a map {calls, autospec, specs, fixtures}
    example: |
      <<testing>>
        mocks:
      <<mocks>>
  testing.tables:
    meaning: the forms a table of cases is written in
    accepts: >-
      a list of forms, each one of decorator, call or loop, with columns_from, rows, row and id; left out or empty:
      the framework writes no table
    example: |
      <<testing>>
      <<table>>
  testing.tables[].decorator:
    meaning: the decorator that holds the table
    accepts: a dotted name, a decorator of the test whose arguments hold the column names and the rows
    example: |
      <<testing>>
      <<table>>
  testing.tables[].call:
    meaning: the calls that hold the table
    accepts: >-
      a list of dotted names, each a call that makes or wraps the test and whose arguments hold the rows; each must be
      listed under a `call` form of testing.declared, else it is refused, testing.tables.0.call: `checks.each` declares
      no test
    example: |
      testing:
        files: [check_*%extension%]
        declared:
          - call: [checks.each]
            title: {position: 0}
            body: {position: 1}
        tables:
          - call: [checks.each]
            columns_from: {position: 0}
            rows: {position: 1}
            row: checks.case
            id: {keyword: id}
  testing.tables[].loop:
    meaning: a loop of the test's body runs the rows
    accepts: "true: the rows are a list literal that a loop statement of the test's body iterates"
    example: |
      <<testing>>
        tables:
          - loop: true
            columns_from: bound
            row: literal
            id: {position: 0}
  testing.tables[].columns_from:
    meaning: where the column names come from
    accepts: >-
      {position: <n>, keyword: <name>} of the holder's arguments, at least one of them, a keyword alone reading only
      the keyword; or parameters, the test's own parameters; or bound, the names the loop binds; or fields, the
      fields of each row
    example: |
      <<testing>>
      <<table>>
  testing.tables[].rows:
    meaning: where the rows are
    accepts: >-
      {position: <n>, keyword: <name>} of the holder's arguments, at least one of them; needed with decorator and
      call, refused with loop
    example: |
      <<testing>>
      <<table>>
  testing.tables[].row:
    meaning: how a row is written
    accepts: "a dotted name, a row being a call of it; or literal, a row being a list or object literal"
    example: |
      <<testing>>
      <<table>>
  testing.tables[].id:
    meaning: what gives a row its id
    accepts: >-
      {keyword: <name>}, a keyword of the row call; {field: <name>}, a field of a literal row; or {position: <n>}, its
      value at that position
    example: |
      <<testing>>
      <<table>>
  testing.mocks.calls:
    meaning: the calls that build a mock
    accepts: a list of dotted names
    example: |
      <<testing>>
        mocks:
      <<mocks>>
  testing.mocks.autospec:
    meaning: the calls that build a mock from a spec argument
    accepts: a list of dotted names
    example: |
      <<testing>>
        mocks:
      <<mocks>>
          autospec: [doubles.make_from]
  testing.mocks.specs:
    meaning: the ways a call that builds a mock names its spec, in order
    accepts: >-
      a non-empty list of entries, each one of {keyword: <name>}, {position: <n>} or {type_argument: <n>}: a call names
      its spec by the first entry it gives, a fix writes the first entry, and an autospec call reads only the first
      keyword entry
    example: |
      <<testing>>
        mocks:
      <<mocks>>
  testing.mocks.specs[].keyword:
    meaning: a keyword argument names the spec
    accepts: a keyword name
    example: |
      <<testing>>
        mocks:
      <<mocks>>
  testing.mocks.specs[].position:
    meaning: the positional argument at a place names the spec
    accepts: "a whole number from 0: the place of the argument"
    example: |
      <<testing>>
        mocks:
          calls: [doubles.make]
          specs: [{keyword: spec}, {position: 0}]
  testing.mocks.specs[].type_argument:
    meaning: the type argument at a place names the spec
    accepts: >-
      a whole number from 0: the place of the type argument; needs call.type_arguments, which a language's reader may
      not supply
    example: |
      <<testing>>
        mocks:
          calls: [doubles.make]
          specs: [{type_argument: 0}]
  testing.mocks.fixtures:
    meaning: test parameters whose methods build mocks
    accepts: "a map {<parameter>: {calls, autospec}}"
    example: |
      <<testing>>
        mocks:
      <<mocks>>
          fixtures:
            maker:
              calls: [build]
  testing.mocks.fixtures.<parameter>.calls:
    meaning: the methods that build a mock
    accepts: a list of method names
    example: |
      <<testing>>
        mocks:
      <<mocks>>
          fixtures:
            maker:
              calls: [build]
  testing.mocks.fixtures.<parameter>.autospec:
    meaning: the methods that build a mock from a spec argument
    accepts: a list of method names
    example: |
      <<testing>>
        mocks:
      <<mocks>>
          fixtures:
            maker:
              calls: [build]
              autospec: [build_from]
  fakes.folder:
    meaning: the folder of the fakes
    accepts: a folder below the tests folder
    example: |
      <<two>>
      <<fakes>>
  fakes.for:
    meaning: the parts whose %interface%s the fakes stand in for
    accepts: "[<part>, ...]"
    example: |
      <<two>>
      <<fakes>>
  fakes.prefix:
    meaning: how a fake's name starts
    accepts: "the start of a class name: the fake of DocumentRepo is FakeDocumentRepo"
    example: |
      <<two>>
      <<fakes>>
  guards.scenario-coverage:
    meaning: every result of a use case has a row
    accepts: >-
      {results: <part>, tier: <tier>, suffix: <text>, columns: [<state>, <command>, <result>], file: <name>}: every
      variant of a union named <Name><suffix> in a results part is the result column of a row of the table in its use
      case's test file <file> (`{name:<case>}` is <Name> in that case: snake, kebab, camel or pascal) of that tier, or
      is named by a standalone test of it; every row is written as its form in `testing.tables` writes one, with a literal id,
      and a table test has no branching; `columns` is written only when `testing.tables` writes a form, and with none
      every variant must be named by a test of the file; read from the syntax tree, never run
    example: |
      <<coverage-guard>>
  guards.no-comments:
    meaning: no `%comment%` comments in the app or its tests
    accepts: >-
      {}: no comment of the language in the app or its tests, `%comment%` or any other form, whole-line or trailing;
      docstrings and doc comments stay, and so do %directives%, a shebang and an encoding line
    example: |
      guards:
        no-comments: {}
  guards.stand-ins:
    meaning: a %interface% is faked, or mocked with a spec
    accepts: >-
      {}: every %interface% in a part `fakes` stands in for is fire-only (every method returns %nothing%) or read (any one
      returns a value), each method annotated; every read port has a fake <prefix><Port> in `fakes.folder`; and a test
      of a tier that may import the fakes gives every mock (`testing.mocks`) a spec, never a read port's; silent where
      it cannot read the code: `*args`, a spec that is a variable, a re-exported port, mocks made by `patch`
    example: |
      <<testing>>
        mocks:
      <<mocks>>
      <<two>>
      <<fakes>>
      guards:
        stand-ins: {}
  guards.closed-tree:
    meaning: every file lies in a part
    accepts: >-
      {}: every %language% file of the app lies in a part or is the package file of a folder of the layout; off unless
      switched on, since a profile is a protocol, not a closed world; a folder the profile `excluded` is not looked at
    example: |
      guards:
        closed-tree: {}
  guards.no-duplicates:
    meaning: no two functions with the same code
    accepts: >-
      {min_statements: <number>}: no two functions or methods of the app (never its tests) have the same code: the same
      tree once formatting, docstrings, annotations, defaults, decorators and local names are ignored, so the same
      statements, calls, attributes, constants, keyword names, async or not, and number of parameters; what is called is
      part of it. A function counts when it holds at least min_statements statements (nested ones counted;
      %min_statements% when left out). The first by file and line is the original; each other is reported naming it
    example: |
      guards:
        no-duplicates: {min_statements: 6}
  guards.no-twins:
    meaning: no two classes in different parts with the same fields
    accepts: >-
      {min_fields: <number>, min_renamed: <number>, min_subset: <number>, translated: [<part>, ...]}: no two public
      classes of the app (never its tests), defined at the top level of files of
      parts with different names, declare the same fields in the same order: the names their bodies annotate, types and
      defaults aside, class variables left out. A class counts when it declares at least min_fields of them
      (%min_fields% when left out) and is no %interface%; two classes of the same part, in one instance of a repeating
      folder or two, are not compared. Of the classes with the same fields, in the order of the parts, then of file and
      line, each one with an earlier twin in a part of another name is reported naming that twin, one of its own
      instance first. With min_renamed, also a renamed copy: of two such classes, the shorter (at least min_renamed
      fields, and at least half as many as the other) against the other's first fields, position by position, differs in
      one name or more, the names that agree are more than half of the longer class's, and every renamed field keeps its
      type (as written, a twin's name read as the name of the class it copies), unless it is the only renamed one and at
      least min_renamed others agree. With min_subset, also a partial copy: one class's field names (at least
      min_subset, and at least half of the other's) are some of the other's, in its order. Each such pair is reported
      once, at the later of the two, naming the earlier; a case left out is off. With `translated`, a pair is no twin
      when a file of a listed part builds one of the two through an import, imports the other, and holds one function
      that names both; each such pair is named in the enforcement section of every `xarch check`
    example: |
      guards:
        no-twins: {min_fields: 3}
  guards.dead-code:
    meaning: no %interface% nothing names, no fake no test uses
    accepts: >-
      {untested: true|false, tests_only: true|false, known: [<file>:<name>, ...]}: every port (a %interface% in a part
      `fakes.for` names) is named by another file of the app, in code or an annotation, and every fake (a top-level
      class of the fakes folder whose name starts with `prefix`) is named by a test outside that folder or by a fake
      that is itself used. The port's own file, package files and the wiring (a part that may import `everything`) do
      not count; names are compared by their last step. With `untested: true`, every file of a part whose `tests` names
      a tier that no test of that tier reaches is also listed as `weak`, failing `check --strict` only (see
      guards.dead-code.untested); with `tests_only: true`, every public name only the tests use, but those `known`
      accepts, which the enforcement section names instead (see guards.dead-code.tests_only and guards.dead-code.known)
    example: |
      <<two>>
      <<fakes>>
      guards:
        dead-code: {}
  guards.pass-through:
    meaning: a method that only forwards is listed
    accepts: >-
      {parts: [<part>, ...]}: a method of those parts whose whole body (a docstring aside) is one `return` or bare
      statement of one call, perhaps awaited, on a chain of at least two attributes of its own first parameter
      (`self.repo.get(...)`), passing every other parameter straight through and nothing more, or one `return` of a
      chain of attributes read on the result of such a call (`return self.repo.get(id).name`), is listed as `weak` in
      the enforcement section and fails `check --strict` only. Any other statement, any other use of the result (an
      item, an operator, a call on it), a changed, extra or dropped argument, a decorator, a dunder method, a function
      outside a class or a call on something not held by the object (`self.helper(...)`) is not one
    example: |
      <<two>>
      guards:
        pass-through:
          parts: [documents]
  guards.no-callbacks:
    meaning: no function of the parts calls a parameter annotated as a callable
    accepts: >-
      {parts: [<part>, ...]}: no function, method or nested function of those parts calls, by its bare name, a
      parameter of a function it lies in that is annotated as a callable type (alone, subscripted, in a union or as an
      optional), as in `check(path)` for `check: Callable[[str], bool]`; each such call is a violation, and fails
      `check`. Not read: the first parameter of a method (`self`, `cls`; a staticmethod has none), a parameter with no
      such annotation, one passed on (`sorted(rows, key=key)`), one whose method is called (`p.read()`), and one the
      body rebinds
    example: |
      <<part>>
      guards:
        no-callbacks:
          parts: [documents]
  guards.private-imports:
    meaning: no name another file keeps private is imported from it
    accepts: >-
      {}: no file of the app or its tests imports a name another file of them keeps private (one the language's reader
      says is not for other files to use, a dunder name aside) from a file of the
      app or its tests, `from x import _y`; an import of a whole file, whatever its name, and an import from an outside
      package or the standard library are not read
    example: |
      guards:
        private-imports: {}
  guards.scenario-coverage.results:
    meaning: the part holding the result unions
    accepts: the name of a part
    example: |
      <<coverage-guard>>
  guards.scenario-coverage.tier:
    meaning: the tier whose test files hold the tables
    accepts: the name of a tier
    example: |
      <<coverage-guard>>
  guards.scenario-coverage.suffix:
    meaning: how a union's name ends
    accepts: text, such as Result
    example: |
      <<coverage-guard>>
  guards.scenario-coverage.columns:
    meaning: the three parameter names of a table
    accepts: "[<state>, <command>, <result>]: required when `testing.tables` writes a form, refused when it writes none"
    example: |
      <<coverage-guard>>
  guards.scenario-coverage.file:
    meaning: the name of a use case's test file
    accepts: a name holding {name:<case>} once, <case> one of snake, kebab, camel, pascal, for the use case
    example: |
      <<coverage-guard>>
  guards.no-duplicates.min_statements:
    meaning: the fewest statements that count
    accepts: a whole number, %min_statements% when left out
    example: |
      guards:
        no-duplicates: {min_statements: 6}
  guards.no-twins.min_fields:
    meaning: the fewest fields that count
    accepts: a whole number, %min_fields% when left out
    example: |
      guards:
        no-twins: {min_fields: 3}
  guards.no-twins.min_renamed:
    meaning: also report a copy that renamed fields, from this many fields
    accepts: >-
      a whole number, at least 2; left out, the case is off. Two classes of parts with different names, the shorter with
      at least this many fields and at least half as many as the other, compared position by position with the other's
      first fields: one name or more differs, the names that agree are more than half of the longer class's fields, and
      every renamed field keeps its type, read as written but for a twin's name, which reads as the class it copies; a
      field renamed and retyped is allowed only when it is the only renamed one and at least this many others agree
    example: |
      guards:
        no-twins: {min_fields: 3, min_renamed: 3}
  guards.no-twins.min_subset:
    meaning: also report a copy of part of a class's fields, from this many fields
    accepts: >-
      a whole number, at least 2; left out, the case is off. A class whose field names, at least this many and at least
      half of the other's, are some of another's in its order (other fields between or around them), in a part of
      another name; types are not compared
    example: |
      guards:
        no-twins: {min_fields: 3, min_subset: 3}
  guards.no-twins.translated:
    meaning: the parts whose files translate a value of one part into a value of another
    accepts: >-
      a list of part names: a pair is no twin when a file of one of them builds one of the two classes through an
      import, imports the other (from the file that defines it, or from one that takes it from there), and holds one
      function that names both, in a parameter's annotation, its return annotation or its body. A file that imports the
      other's file for another class, whose functions name the two apart, or that builds a class it defines itself (a
      call through no import) translates nothing. Every `xarch check` names each pair so accepted, and the function, in
      its enforcement section; `profile check` lists each part the bundled profile does not as looser
    example: |
      parts:
        documents/:
          role: the documents
        adapters/:
          role: the documents as the outside reads them
          imports: {may: [parts.documents]}
      guards:
        no-twins: {min_fields: 2, translated: [adapters]}
  guards.dead-code.untested:
    meaning: also list the files no test of their tier reaches
    accepts: >-
      true or false: every file of a part whose `tests` names a tier, which no test code of that tier (a file below the
      tests folder that the tier holds, test or not) imports, directly or through files of parts of that same tier that
      it reaches, is listed as `weak` in the enforcement section and fails `check --strict` only. Exempt: a package
      file, and a file with no function or method holding a real statement (types, constants, %interface% stubs). Read
      only with a tests folder
    example: |
      <<two>>
      <<fakes>>
      guards:
        dead-code: {untested: true}
  guards.dead-code.tests_only:
    meaning: also list the public names only the tests use
    accepts: >-
      true or false: every public class and top-level function a file of the app defines (a package file aside) that no
      other file of the app names, in code or an annotation, by its last step, is listed as `weak` in the enforcement
      section and fails `check --strict` only: only the tests use it, or nothing does. A name its own file alone uses is
      listed too: make it private
    example: |
      <<two>>
      <<fakes>>
      guards:
        dead-code: {tests_only: true}
  guards.dead-code.known:
    meaning: the public names only the tests use that the profile accepts
    accepts: >-
      a list of `<file below the app>:<name>`, each a public class or top-level function that file defines which only
      the tests use: `tests_only` lists it no more, and every `xarch check` names it in its enforcement section instead.
      An entry whose file defines no such name, whose name another file of the app names, or that no test names in its
      code (a string of a test does not count), is itself listed as `weak` and fails `check --strict` only. Needs `tests_only: true`. `profile check` lists each entry the bundled profile
      does not as looser
    example: |
      <<two>>
      <<fakes>>
      guards:
        dead-code: {tests_only: true, known: [documents/wiring%extension%:build_documents]}
  guards.pass-through.parts:
    meaning: the parts whose forwarding methods are listed
    accepts: "[<part>, ...]"
    example: |
      <<two>>
      guards:
        pass-through:
          parts: [documents]
  guards.no-callbacks.parts:
    meaning: the parts whose functions call no parameter annotated as a callable
    accepts: "[<part>, ...]"
    example: |
      <<part>>
      guards:
        no-callbacks:
          parts: [documents]
  docs.entry:
    meaning: the part that is the entry point
    accepts: the name of a part
    example: |
      docs:
        entry: documents
  docs.pages:
    meaning: the project docs `init` writes below docs/project/
    accepts: "a map {<path>: <from> or {from, note}}"
    example: |
      <<pages>>
  docs.naming:
    meaning: the naming table of the docs
    accepts: a list of {kind, where, pattern, example}
    example: |
      docs:
        naming:
          - kind: store
            where: [store]
            pattern: <Thing>Store
            example: [DocumentStore]
  docs.examples:
    meaning: folders next to the profile, each an example project
    accepts: "[<folder>, ...]: a template quotes one of its files by its path with {{example:<path>}}"
    example: |
      docs:
        examples: [examples]
  docs.example_notes:
    meaning: a note for an example
    accepts: "a map {<path>: <note>}, shown after the example's path"
    example: |
      docs:
        examples: [examples]
        example_notes:
          src/documents%extension%: the documents
  docs.pages.<path>.from:
    meaning: the template file, next to the profile
    accepts: a path
    example: |
      <<pages>>
  docs.pages.<path>.note:
    meaning: shown after its line in the docs tree
    accepts: one line of text
    example: |
      <<pages>>
  docs.naming[].kind:
    meaning: what is named
    accepts: text, such as store
    example: |
      docs:
        naming:
          - kind: store
            where: [store]
            pattern: <Thing>Store
            example: [DocumentStore]
  docs.naming[].where:
    meaning: the folders it lives in
    accepts: text or a list of text
    example: |
      docs:
        naming:
          - kind: store
            where: [store]
            pattern: <Thing>Store
            example: [DocumentStore]
  docs.naming[].pattern:
    meaning: how it is named
    accepts: text
    example: |
      docs:
        naming:
          - kind: store
            where: [store]
            pattern: <Thing>Store
            example: [DocumentStore]
  docs.naming[].example:
    meaning: names that follow the pattern
    accepts: text or a list of text
    example: |
      docs:
        naming:
          - kind: store
            where: [store]
            pattern: <Thing>Store
            example: [DocumentStore]
  files.<path>.from:
    meaning: the template file, or the folder of a path ending in /
    accepts: "a path next to the profile: a file, or a folder when the key ends in /"
    example: |
      files:
        tests/rules%extension%:
          from: guard%extension%
  files.<path>.pinned:
    meaning: "`check` reports the file when it differs"
    accepts: "true: the project keeps the file as `init` writes it"
    example: |
      files:
        tests/rules%extension%:
          from: guard%extension%
          pinned: true
  files.<path>.fill:
    meaning: whether {{app}} is filled in
    accepts: "false: the bytes are copied unchanged"
    example: |
      files:
        tests/rules%extension%:
          from: guard%extension%
          fill: false
  review.never:
    meaning: the files review never sends
    accepts: >-
      a list of paths below the app, each with its steps written with `/`: a step as written, `*` for any text inside
      one step, and a step that is `**` for any number of folders, none included; a path matches a file, or a folder
      and every file below it. A file chosen that one matches is not read into any request: every run, `--dry-run`
      included, lists it as left out with the path that matched. The profile's own examples are covered too (a file of
      `docs.examples` or `evals.placement.examples`, an example of an eval of its own, by its path below the app):
      `review calibrate`, `--dry-run` included, never sends one it matches and lists it as held back with the path;
      placement and each eval are held to, and held as, the examples that remain, and an eval left with fewer than
      %fewest_examples% of a kind is not held. Refused: a path that starts with `/` or has an empty,
      `.` or `..` step, `**` inside a longer step, a path of nothing but `*` and `**` (it would hold back every file),
      the same path twice. `profile check` lists a path the profile it is compared with holds that this one does not as
      looser. Not the top-level `never`, the names a part never uses, which is another list
    example: |
      review:
        never: [documents/drafts, "**/secrets"]
  review.mask:
    meaning: the texts review hides before it sends
    accepts: >-
      a list of texts, each one line, as written (case counts), `*` standing for a run of one or more letters, digits,
      `_`, `-` and `.`: each match in a file's text is sent as `<masked>`. It adds to what review always hides: every
      comment, as the reader of the language finds it (cut from its line, the line kept), the module each import of the
      app's own code names and every e-mail address. Refused: a text of nothing but `*` and
      spaces (it would hide every word), a text of two lines, the same text twice. `profile check` lists a text the
      profile it is compared with hides that this one does not as looser
    example: |
      review:
        mask: [Northwind, "DOC-*"]
  evals.placement:
    meaning: how review reads placement's answers
    accepts: >-
      a map {lines, alike, examples}: the line of each part, below which a file reads as doubtful where it sits, the
      groups of parts one file cannot tell apart, and the examples `xarch review calibrate` holds placement to besides
      the docs' examples
    example: |
      evals:
        placement:
          lines: {documents: 0.2}
  evals.placement.lines:
    meaning: the line of each part, below which a file reads as doubtful there
    accepts: >-
      a map from the name of a part to a number above 0 and below 1: a file judged reads as doubtful where it sits
      when the probability on its part is below the part's line; a part not written has %line%, the line the trials
      measured (about one well-placed file in ten read as doubtful at it). A file whose first answer falls within 0.15
      of its part's line is asked again in two other orders of the options and read on the mean. Every reading says a
      line set here as set by the profile. Set one when the per-part summary of `xarch review` notes a part low across
      the board and its litmus, read first, does describe its files. Refused: a name
      that is no part, a value that is no number above 0 and below 1. `profile check` lists a part whose line here is
      below the one the profile it is compared with gives it as looser
    example: |
      evals:
        placement:
          lines: {documents: 0.2}
  evals.placement.alike:
    meaning: the groups of parts one file cannot tell apart
    accepts: >-
      a list of groups, each a list of two parts or more, such as two parts of pure functions that differ only in how
      many modules use them, which no single file shows. A file in a part of a group is read on the sum of the
      probabilities on the group's parts, against its own part's line: for doubt, for asking again near the line, for
      the order of the readings and for the summary of each part, its pieces ranked on the same sum; every reading
      says the parts counted with its own, and the JSON keeps the probability on each part as answered. `xarch review
      calibrate` holds each part of a group as one with the others: an example's reading on its own part is the
      group's sum, an example of one part reading at or above the line of another part of its group crosses nothing,
      and an example of a part outside the group is held below a part's line on the group's sum; a record of
      placement held under other groups is stale. Refused: a name that is no part, a group of fewer than two parts or
      naming a part twice, a part in two groups, and parts that differ in `uses.never` or `holds` (the kinds it
      lists and the `immutable` of each): `check` tells those apart by rule, so they are not alike. Name only parts that truly cannot be told apart
      from one file: a group hides every doubt between its parts
    example: |
      <<two>>
      evals:
        placement:
          alike: [[core, documents]]
  evals.placement.examples:
    meaning: the examples placement is held to, besides the docs'
    accepts: >-
      {flagged: {<path>: <code>, ...}, clean: {<path>: <code>, ...}}, each a path below the app ending in %extension%,
      the part it lies in being the part its path names: a clean file belongs in that part, a flagged one does not; a
      path lying in no part is refused at its address. `xarch review calibrate --eval placement` asks placement of them and of every file of `docs.examples` lying in
      a part (those are clean), and holds each part to them: its clean files must read at or above its line, and
      every file claimed for it from elsewhere below it (a flagged file in it, and each other example's probability
      on it). A part whose examples disagree is read in review but never marked doubtful; one with no example of its
      own is measured elsewhere only. The examples are short, and short files read lower: a sanity check of the
      litmus texts, not a way to set lines
    example: |
      <<part>>
      evals:
        placement:
          examples:
            clean: {documents/titles%extension%: "%comment% the titles of the documents\n"}
slots:
  evals.<id>.ask:
    meaning: the question the eval asks
    accepts: >-
      one line of text, at most %max_ask% characters and one question mark: one short rule about what the text shows. In
      trials a long compound question was the one that failed to tell its examples apart
    example: |
      <<part>>
      <<eval>>
  evals.<id>.answer:
    meaning: the form of the answer
    accepts: >-
      `yes-no`, read as the probability of yes; `{score: [<level 0>, ..., <level 4>], flagged_from: <n>}`, five
      levels each saying what it means, the worst last, read as the expected level over 4, `flagged_from` the level
      (1 to 4) from which a reading counts as flagged, so the line is never below it; or `{choice: {<option>:
      <description>, ...}, flagged: [<option>, ...]}`, three options or more, read as the probability of the flagged
      ones, the mean of two orders of the options. Two options are refused: write yes-no
    example: |
      <<part>>
      evals:
        purity:
          ask: How much of this file's work reads or writes something outside its arguments?
          answer:
            score: ["none: it computes from its arguments", "it reads a constant of its own", "it reads a constant of another file", "it reads a file, the clock or the environment", "it writes something"]
            flagged_from: 3
          reads: file
          message: "{file} may reach outside its arguments ({value})"
          fix: "read it against the litmus of documents/: if it reaches outside, pass what it reads as an argument"
      <<eval-examples>>
  evals.<id>.yes:
    meaning: what a yes answer means
    accepts: "a sentence, with `answer: yes-no` only; sent with the question"
    example: |
      <<part>>
      <<eval>>
  evals.<id>.no:
    meaning: what a no answer means
    accepts: "a sentence, with `answer: yes-no` only; sent with the question"
    example: |
      <<part>>
      <<eval>>
  evals.<id>.reads:
    meaning: what one question is asked of
    accepts: >-
      `file`, each file whole; `class`, each class at the top level of a file; `function`, each function, a method
      included, as the check vocabulary's kinds of fact of those names; refused when the language's reader does not
      supply the fact
    example: |
      <<part>>
      <<eval>>
  evals.<id>.in:
    meaning: the files the eval is asked in
    accepts: >-
      `{part, where}`, as a check's `in`: the part (any when left out) and the filters about the file it passes. Only
      the app's files are read, never the tests, so `files` and `tier` are refused. Of the files a review chooses, it
      asks only those in its scope, and never one placement leaves out
    example: |
      <<part>>
      <<eval>>
  evals.<id>.keep:
    meaning: the filters a file, class or function must pass to be asked
    accepts: >-
      a list of filters of the check vocabulary (`xarch profile explain filters`), as a check's `keep`, such as
      [public]; `profile check` refuses a filter that does not apply to the kind read
    example: |
      <<part>>
      <<eval>>
  evals.<id>.line:
    meaning: the value from which a reading is listed
    accepts: >-
      a number above 0 and below 1. Left out, `xarch review calibrate` sets it: midway between the lowest flagged
      example and the highest clean one, never below 0.5 (for a score, never below the level `flagged_from` names)
    example: |
      <<part>>
      <<eval>>
          line: 0.6
  evals.<id>.message:
    meaning: what is said of a reading
    accepts: "a sentence, with {file}, {line}, {name} and {value} (two decimals) for what it names"
    example: |
      <<part>>
      <<eval>>
  evals.<id>.fix:
    meaning: what to do about a reading
    accepts: >-
      a sentence, with {file}, {line}, {name} and {value}; start it from reading something (the litmus, the rule), not
      from an edit: a reading is a reason to look, not a finding
    example: |
      <<part>>
      <<eval>>
  evals.<id>.examples:
    meaning: the code the eval must read as flagged, and as clean
    accepts: >-
      {flagged: {<path>: <code>, ...}, clean: {<path>: <code>, ...}}, at least %fewest_examples% files of each, each a path below the
      app ending in %extension% and its code. `profile check` refuses a file in which nothing the eval reads (in its
      scope, passing `keep`) is found. `xarch review calibrate` sends them and holds the eval to them: every flagged
      file reads above every clean one, by at least 0.4 on the mean, and on the right side of the line. Add a clean
      example of the case the question must not catch
    example: |
      <<part>>
      <<eval>>
