# The language Python, as a profile names it with `language: python`: what is true of the language as a whole and is
# needed outside the reader that turns source into facts. title is how a message says it; extension the ending of a
# source file's name; package_file the file that stands for the folder holding it; interface the dotted names that mark
# a class as an interface (a port); dynamic the callables that import by a name worked out when the code runs;
# namespace the namespace of the names the language binds without an import; cache the folder its tools keep what they
# compile in, whose files neither the checks nor the examples read; standard where the names of the standard
# library are known from (interpreter: the one running xarch). The tokens of its code that the checks and the docs
# need: name, what a name may be (a regular expression); package, what an import names from outside the app as one
# step (a regular expression); member, the text that joins a package to a name in it in a profile's lists (name,
# package and member are given together); private, how a name starts that is private to its file or
# folder; special, what a name the language reserves for itself starts and ends with; call, the special method that
# calling an instance runs; nothing, the return annotation of a function that gives no value; comment, the marker of a
# line comment; directives, the comments its tools read as instructions, each after the marker (a space in one stands
# for any spaces); shebang, how line 1 names the program that runs the file; encoding, how line 1 or 2 declares the
# file's encoding (a regular expression, after the marker); branching, the keywords of the statements that branch;
# branching_expressions, the keywords of the expressions that choose between values, as its reader records them;
# immutable, what makes a class an immutable record: a dotted name among its bases or its decorators, a decorator
# called with each keyword written after it, as written; importing, how a file imports a name from another file of the app, {dotted} standing for that file's dotted path
# and {name} for the name.
# supplies: the facts its reader turns the source into, each exact or {partial: what it misses}; a key whose check
# needs a fact not listed here is refused, and one that reads a partial fact is listed as approximate.
title: Python
extension: .py
package_file: __init__.py
interface: [{base: typing.Protocol}, {base: typing_extensions.Protocol}]
dynamic: [importlib.import_module, importlib.__import__, builtins.__import__]
namespace: builtins
cache: __pycache__
standard: interpreter
name: '(?!\d)\w+'
package: '(?!\d)\w+'
member: "."
private: _
special: '(?=__)\w*(?<=__)'
call: __call__
nothing: None
comment: "#"
directives: ["type: ignore", noqa, "pragma:"]
shebang: "#!"
encoding: 'coding[:=][ \t]*[-\w.]+'
branching: [if, match, try, for, while]
branching_expressions: [if]
immutable: [typing.NamedTuple, "dataclasses.dataclass(frozen=True)"]
importing: "from {dotted} import {name}"
supplies:
  file: exact
  syntax: exact
  import: exact
  import.relative: exact
  import.standard: exact
  import.resolved: exact
  import.mentioned: exact
  comment: exact
  use: exact
  call: exact
  method_call: exact
  parameter_call: exact
  callback: exact
  class: exact
  class.methods: exact
  class.attributes: exact
  class.fields: exact
  class.types: exact
  class.exception: exact
  class.named: exact
  class.immutable: exact
  function: exact
  function.statements: exact
  function.shape: exact
  function.signature: exact
  function.sole_call: exact
  function.decorated: exact
  function.forwards: exact
  function.returns: exact
  function.blocks: exact
  function.expressions: exact
  function.asserts: exact
  function.mentions: exact
  function.named: exact
  function.tables: exact
  union: exact
  module_functions: exact
  constant: exact
  named: exact
  piece: exact
