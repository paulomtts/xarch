# The language Python, as a profile names it with `language: python`: what is true of the language as a whole and is
# needed outside the reader that turns source into facts. title is how a message says it; extensions the endings of a
# source file's name, the first the one a message prints; package_files the files that stand for the folder holding
# them, each ending in one of the extensions (optional: a language may have none); interface the marks of a class that
# is an interface (a port), each {base: <outside name>}, a name among its bases, or {keyword: <word>}, a keyword its
# declaration carries (Python declares none with one); dynamic the callables that import by a name worked out when the
# code runs; namespace the namespace of the names the language binds without an import; cache the folder its tools
# keep what they compile in, whose files neither the checks nor the examples read; standard where the names of the
# standard library are known from (interpreter: the one running xarch). The tokens of its code that the checks and the
# docs need: name, what a name may be (a regular expression); package, what an import names from outside the app as
# one step (a regular expression); member, the text that joins a package to a name in it in a profile's lists (name,
# package and member are given together); private, how a name starts that is private to its file or folder, by which
# the reader decides that a name is not public (the fact public) and scaffold and layout refuse or skip a private
# name; special, the pattern of a name the language reserves for itself (a regular expression the whole name matches);
# call, the special method that calling an instance runs; nothing, the return annotations that say a function gives no
# value, as the reader writes them (a list); unannotated, left out here, would say with its one value, nothing, that a
# function with no return annotation gives none; comments, the forms a comment is written in, each {line: <marker>},
# to the end of its line, {block: [<open>, <close>]}, or {doc: [<open>, <close>]}, a comment that holds documentation
# (its closing may be "" for the end of its line; Python writes line comments only, its documentation being in
# docstrings), the docs printing the first line form's marker; directives, the comments its tools read as
# instructions, each after the marker of a comment of any form (a space in one stands for any spaces); shebang, how
# line 1 names the program that runs the file; encoding, how line 1 or 2 declares the file's encoding (a regular
# expression, after the marker of a comment of any form); branching, the keywords of the statements that branch;
# branching_expressions, the keywords of the expressions that choose between values, as its reader records them;
# immutable, the marks of an immutable record, each in one of four forms: {base: <outside name>}, a name among its
# bases; {decorator: <outside name>, keywords: {<name>: <value>}}, a decorator called with each keyword given, its
# value as written and quoted so that it stays text (keywords left out: however it is written); {fields: <word>}, a
# keyword that marks every field; or {type: <outside name>}, a wrapper type. Python writes the first two. importing,
# how a file imports a name from another file of the app, {dotted} standing for that file's dotted path and {name} for
# the name. writing, how a row of a table of cases is written: call, a row that is a call, {callee} standing for what
# it calls; keyword, a row call whose id a keyword gives, {keyword} and {text} standing for the keyword and the id's
# text; field, a literal row whose id a field gives, Python does not write; specs, how a call that builds a mock names
# its spec: keyword, by a keyword argument, {keyword} and {value} standing for the keyword and the spec; position, by
# the positional argument at a place, {before} standing for the places before it and {value} for the spec;
# type_argument, by a type argument, Python does not write. worked, how the code of the checks written for the
# explanation is written: subclass, a class that derives from a base, {name} and {base} standing for the two names;
# function, defaulted, annotated and returning, a function of one parameter, with a default {value}, an {annotation},
# or of none with a return annotation {returns}; keyword_call, a call passing one keyword argument.
# supplies: the facts its reader turns the source into, each exact or {partial: what it misses}; a key whose check
# needs a fact not listed here is refused, and one that reads a partial fact is listed as approximate. file.package,
# that a file stands for its folder, is never listed here: it follows package_files.
title: Python
extensions: [.py]
package_files: [__init__.py]
interface: [{base: typing.Protocol}, {base: typing_extensions.Protocol}]
dynamic: [importlib.import_module, importlib.__import__, builtins.__import__]
# dynamic_attributes: the callables that read a member of an object by a name worked out when the code runs; a call of
# one on a name an import binds is listed as dynamic, since no check can follow the name it reads.
dynamic_attributes: [builtins.getattr]
namespace: builtins
cache: __pycache__
standard: interpreter
name: '(?!\d)\w+'
package: '(?!\d)\w+'
member: "."
private: _
special: '(?=__)\w*(?<=__)'
call: __call__
nothing: [None]
comments: [{line: "#"}]
directives: ["type: ignore", noqa, "pragma:"]
shebang: "#!"
encoding: 'coding[:=][ \t]*[-\w.]+'
branching: [if, match, try, for, while]
branching_expressions: [if]
immutable: [{base: typing.NamedTuple}, {decorator: dataclasses.dataclass, keywords: {frozen: "True"}}]
importing: "from {dotted} import {name}"
writing:
  call: "{callee}(...)"
  keyword: '{callee}(..., {keyword}="{text}")'
  specs:
    keyword: "{callee}({keyword}={value})"
    position: "{callee}({before}{value})"
worked:
  subclass: "class {name}({base}): ..."
  function: "def {name}({parameter}): ..."
  defaulted: "def {name}({parameter}={value}): ..."
  annotated: "def {name}({parameter}: {annotation}): ..."
  returning: "def {name}() -> {returns}: ..."
  keyword_call: "{callee}({keyword}={value})"
supplies:
  file: exact
  file.lines: exact
  syntax: exact
  import: exact
  import.relative: exact
  import.standard: exact
  import.type_only: exact
  import.resolved: exact
  import.mentioned: exact
  comment: exact
  comment.doc: exact
  public: exact
  use: exact
  call: exact
  method_call: exact
  parameter_call: exact
  callback: exact
  class: exact
  class.methods: exact
  class.attributes: exact
  class.fields: exact
  class.types: exact
  class.exception: exact
  class.named: exact
  class.bases: exact
  class.immutable: exact
  class.interface: exact
  class.record: exact
  function: exact
  function.top_level: exact
  function.statements: exact
  function.shape: exact
  function.signature: exact
  function.parameters: exact
  function.return_annotation: exact
  function.sole_call: exact
  function.decorated: exact
  function.forwards: exact
  function.returns: exact
  function.blocks: exact
  function.expressions: exact
  function.asserts: exact
  function.mentions: exact
  function.named: exact
  function.tables.decorator: exact
  function.tables.loop: exact
  test.function: exact
  union: exact
  module_functions: exact
  constant: exact
  named: exact
  piece: exact
