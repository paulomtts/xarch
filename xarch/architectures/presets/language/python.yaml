# The language Python, as a profile names it with `language: python`: what is true of the language as a whole and is
# needed outside the reader that turns source into facts. title is how a message says it; extension the ending of a
# source file's name; package_file the file that stands for the folder holding it; interface the dotted names that mark
# a class as an interface (a port); dynamic the callables that import by a name worked out when the code runs;
# namespace the namespace of the names the language binds without an import; cache the folder its tools keep what they
# compile in, which no check or example reads; standard where the names of the standard
# library are known from (interpreter: the one running xarch). The tokens of its code that the checks and the docs
# need: name, what a name may be (a regular expression); private, how a name starts that is private to its file or
# folder; special, what a name the language reserves for itself starts and ends with; call, the special method that
# calling an instance runs; nothing, the return annotation of a function that gives no value; comment, the marker of a
# line comment; directives, the comments its tools read as instructions, each after the marker (a space in one stands
# for any spaces); shebang, how line 1 names the program that runs the file; encoding, how line 1 or 2 declares the
# file's encoding (a regular expression, after the marker); branching, the keywords of the statements that branch.
title: Python
extension: .py
package_file: __init__.py
interface: [typing.Protocol, typing_extensions.Protocol]
dynamic: [importlib.import_module, importlib.__import__, builtins.__import__]
namespace: builtins
cache: __pycache__
standard: interpreter
name: '(?!\d)\w+'
private: _
special: __
call: __call__
nothing: None
comment: "#"
directives: ["type: ignore", noqa, "pragma:"]
shebang: "#!"
encoding: 'coding[:=][ \t]*[-\w.]+'
branching: [if, match, try, for, while]
