# The test framework pytest, as a profile names it with `testing: pytest`: the same map a profile writes out for another
# framework. How a test file is named and how a test is declared, what skips a test or expects it to fail, the table
# forms it writes, and how a mock is built.
files: ["test_*.py", "*_test.py"]
declared:
  - function: "test_*"
skips: [pytest.mark.skip, pytest.mark.skipif, pytest.mark.xfail, pytest.skip, pytest.xfail, pytest.importorskip,
        unittest.skip, unittest.skipIf, unittest.skipUnless, unittest.expectedFailure]
tables:
  - decorator: pytest.mark.parametrize
    columns_from: {position: 0, keyword: argnames}
    rows: {position: 1, keyword: argvalues}
    row: pytest.param
    id: {keyword: id}
mocks:
  calls: [unittest.mock.Mock, unittest.mock.MagicMock, unittest.mock.AsyncMock, unittest.mock.NonCallableMock,
          unittest.mock.NonCallableMagicMock]
  autospec: [unittest.mock.create_autospec]
  spec_keywords: [spec, spec_set]
  spec_position: 0
  fixtures:
    mocker: {calls: [Mock, MagicMock, AsyncMock, NonCallableMock, NonCallableMagicMock], autospec: [create_autospec]}
