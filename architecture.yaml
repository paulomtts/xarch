# The architecture xarch itself follows: the layout and rules of the bundled cli profile, the outside packages xarch
# really uses, and the tests it really has. `xarch check --app xarch` reads it through [tool.xarch] in pyproject.toml.
xarch: 1
name: xarch

layout:
  bootstrap:
    migrations: {}
  kernel:
    logic: {}
  modules:
    # `each` is the repeating folder, one per instance; `singular` names one instance, as the docs show it
    singular: module
    each:
      contract: {}
      domain: {}
      application:
        controller.py: file
        services: {}
        logic: {}
        ports: {}
      adapters: {}
  platform: {}
  cli:
    commands: {}

parts:
  kernel:     {path: kernel, role: "pure primitives and the rules two modules share"}
  domain:     {path: modules/*/domain, role: "entities, values, errors: invariants only"}
  contract:   {path: modules/*/contract, role: "the module's published language: commands, Results"}
  controller: {path: modules/*/application/controller.py, role: "maps failures to a Result"}
  services:   {path: modules/*/application/services, role: "use-case steps: load, check, act"}
  logic:      {path: modules/*/application/logic, role: "pure functions over the module's domain objects"}
  ports:      {path: modules/*/application/ports, role: "Protocols for what the module needs from the outside"}
  adapters:   {path: modules/*/adapters, role: "implement the ports on the filesystem or another module's contract"}
  platform:   {path: platform, role: "the filesystem, TOML and YAML readers",
               untested: "it wraps the standard library and yaml; the adapter and wired tests reach it on real files"}
  cli:        {path: cli, entry: true, role: "the only place for commands and terminal output"}
  bootstrap:  {path: bootstrap, role: "composition root: binds ports to adapters, hands controllers to cli/"}

# The same rules as the bundled cli profile.
rules:
  kernel:     [kernel]
  domain:     [domain@own, kernel]
  contract:   [contract@own, domain@own/values, kernel]
  controller: [controller@own, services@own, logic@own, domain@own, ports@own, contract@own, kernel]
  services:   [services@own, logic@own, domain@own, ports@own, contract@own, kernel]
  logic:      [logic@own, domain@own, kernel]
  ports:      [ports@own, domain@own, kernel]
  adapters:   [adapters@own, ports@own, domain@own, kernel, platform, contract@any]
  platform:   [platform, kernel]
  cli:        [cli, controller@any, contract@any, kernel]
  bootstrap:  ["*"]

# The outside packages xarch imports, where it imports them.
libraries:
  platform: [yaml]
  cli:      [typer]

# The names xarch's pure parts may not use, as the bundled profiles list them: no clock and no I/O by name in the
# kernel, a module's domain, contract, logic or ports; the files are read behind the ports, by the adapters and
# platform/. &pure names the list once and *pure repeats it.
forbidden:
  kernel:     &pure [datetime.datetime.now, datetime.datetime.utcnow, datetime.datetime.today, datetime.date.today,
                     time.time, time.time_ns, time.monotonic, time.perf_counter, builtins.open, builtins.print,
                     builtins.input, sys.stdin, sys.stdout, sys.stderr, os.environ, os.getenv, socket, subprocess,
                     sqlite3, urllib, http, shutil]
  domain:     *pure
  contract:   *pure
  logic:      *pure
  ports:      *pure

# How xarch's tests are named, and what skips one, as the bundled profiles say it for pytest.
tests:
  files: ["test_*.py", "*_test.py"]
  functions: "test_*"
  skips: [pytest.mark.skip, pytest.mark.skipif, pytest.mark.xfail, pytest.skip, pytest.xfail, pytest.importorskip,
          unittest.skip, unittest.skipIf, unittest.skipUnless, unittest.expectedFailure]

# xarch's tests, as they are. A test imports only what the part its folder mirrors may import, so where it lives says
# what it may use: pure code and adapters are called directly; a controller or service is driven around the fakes of
# tests/fakes/; what needs the whole app (a command, a check on real files, a bundled profile) is driven through
# what bootstrap/ wires, from tests/bootstrap/ (or tests/cli/ for what cli/ renders); the guard runs the wired check on
# xarch's own source. bootstrap/'s rule is "*", so a wired or guard test may import anything; `types_only` keeps it from
# calling the inner parts: it drives bootstrap/, cli/ and the contracts, and may use the rest only as types. The format
# has no way to forbid an import or an attribute read there, so those stay open.
tiers:
  - name: unit
    subject: [kernel, kernel/logic, domain, logic, adapters]
    proves: a pure rule of the kernel or a module, or an adapter's translation
    may_touch: "what the part it mirrors may import; an adapter, temporary folders"
    forbidden: true
    litmus: Does it call one part's own code directly, with nothing wired, and check its answer?
    example: {path: tests/kernel/logic/test_placement.py, file: tests/kernel/logic/test_placement.py}
  - name: integration
    subject: [controller, services, ports, contract]
    proves: a use case, through its controller around fakes
    may_touch: "what the part it mirrors may import; `tests/fakes/`"
    litmus: Does it drive a controller around fakes and check the Result it returns?
    example: {path: tests/modules/rules/application/test_check.py, file: tests/modules/rules/application/test_check.py}
  - name: wired
    subject: [bootstrap, cli]
    proves: a command, a check on real files, or what a bundled profile holds, through the app bootstrap/ wires
    may_touch: "anything bootstrap/ wires; temporary folders"
    types_only: [domain, logic, ports, services, controller, adapters, platform]
    litmus: Does it need the whole app, as bootstrap/ wires it, to mean anything?
    example: {path: tests/bootstrap/test_app.py, file: tests/bootstrap/test_app.py}
  - name: guard
    subject: [bootstrap]
    subject_text: xarch's own source tree
    proves: xarch follows the architecture it enforces
    may_touch: "`tests/architecture/`"
    types_only: [domain, logic, ports, services, controller, adapters, platform]
    litmus: Does it run the wired check on xarch's own source?
    example: {path: tests/architecture/test_self_check.py, file: tests/architecture/test_self_check.py}

# The fakes of the ports, one per read port, each named Fake<Port>; stand-ins holds the ports to their kind: a port
# with any method that returns a value is read, one whose methods all return None is fire-only.
fakes: {path: tests/fakes, for: [ports], prefix: Fake}

guards:
  package-only:      [contract]
  scenario-coverage:
    results: contract
    tier: integration
    suffix: Result
    columns: [given, when, then]
    table: {decorator: pytest.mark.parametrize, row: pytest.param, id: id, keywords: [argnames, argvalues]}
    file: "test_{name}.py"
  no-comments:       {}
  stand-ins:
    mocks: [unittest.mock.Mock, unittest.mock.MagicMock, unittest.mock.AsyncMock,
            unittest.mock.NonCallableMock, unittest.mock.NonCallableMagicMock]
    autospec: [unittest.mock.create_autospec]
    spec: [spec, spec_set]
