# The architecture xarch itself follows: the cli profile, with the packages xarch uses and the tests it has.
xarch: 2
name: xarch
based_on: cli
language: python
testing: pytest

parts:
  domain:
    path: modules/<module>/domain
    role: "entities, values, errors: invariants only; in published.py, the values handed out as they are"
    litmus: >-
      Is it an invariant of one of this module's values or records (a validation that refuses to build a wrong one),
      or an error the module raises, that runs with no file read and no clock? If yes, it goes here, on that value. If
      it is a value the module hands out as it is, with nothing to reshape, it goes in `domain/published.py`, which
      `contract/` re-exports. If it is a value a profile or its language's data file says, which spec builds and rules
      reads in full too, it belongs in `profile_values/`. If it is a pure rule that is not one value's invariant, it
      belongs in `application/logic/`. If it must read anything, it is a service step through a port.
    may_import: [kernel, kernel-logic, profile-values]
    forbidden: pure
    holds: classes
    no_callbacks: true
    tier: unit

  logic:
    path: modules/<module>/application/logic
    role: pure functions over the module's domain objects
    litmus: >-
      Is it a pure function over this module's domain values that decides one rule, with no port and no file read? If
      yes, it goes here, in a file named for what it decides, and every record it returns is immutable. If it is one
      value's invariant, it belongs on that value in `domain/`. If another module needs the same rule, it belongs in
      `kernel/logic/`. If it must read or write anything, it is a service step through a port.
    may_import: [domain, kernel, kernel-logic, profile-values]
    forbidden: pure
    holds: functions
    immutable: true
    tier: unit

  ports:
    path: modules/<module>/application/ports
    role: Protocols for what the module needs from the outside
    litmus: >-
      Is it something a use case of this module needs from outside it (files on disk, the source a reader parses,
      another module's answer), declared as a `Protocol` in this module's own words, with no body? If yes, it goes
      here. If it has a body that reads a file or calls another module, it belongs in `adapters/`. A value the port
      hands back belongs in `domain/`, unless it is already a value of `profile_values/` or `kernel/` that the port
      hands back as it is.
    may_import: [domain, kernel, kernel-logic, profile-values]
    forbidden: pure
    holds: classes
    tier: integration

  services:
    path: modules/<module>/application/services
    role: "use-case steps: load, check, act; they assemble what the use case hands out"
    litmus: >-
      Does it run one use case as steps (load through a port, check, act), calling ports, logic and domain values, and
      assemble what the use case hands out on success from what they return? If yes, it goes here. If it decides what
      is valid, or what the Result says (a condition, a default, a sentence), it belongs in `application/logic/`, and
      the service calls it. If it turns a failure into a Result variant, it belongs in the controller. If it reads a
      file or another module, it does so through a port.
    may_import: [logic, domain, ports, contract, kernel, kernel-logic, profile-values]
    holds: classes
    names: "*Service"
    forbidden: ambient
    built_by: [bootstrap]
    tier: integration

  controller:
    path: modules/<module>/application/controller.py
    role: maps failures to Result variants
    litmus: >-
      Does it turn each error a service raises into the Result variant that says it, and return what the service
      assembled, deciding nothing else? If yes, it goes here, and no error of the module leaves it past here. A use
      case that cannot fail has its method here too, handing the service the fields of its command and returning what
      the service assembled; a method that only passes its own parameters on adds nothing, and `pass-through` lists
      it. If it builds a Result from logic or domain values itself, that assembly belongs in a service. If it parses
      arguments or prints, it belongs in `cli/`.
    may_import: [services, contract, domain/errors, kernel, kernel-logic, profile-values]
    holds: classes
    names: "*Controller"
    forbidden: ambient
    built_by: [bootstrap]
    tier: integration

  adapters:
    path: modules/<module>/adapters
    role: implement the ports on the filesystem or another module's contract
    litmus: >-
      Does it implement one of this module's ports against the filesystem, the checked language's source or another
      module's controller, translating between that and the module's own types, and naming no other module but the
      `contract/` of the one whose controller it wraps? If yes, it goes here. If it decides a rule of the module (what
      a check finds, whether a fact is supplied), that rule belongs in `application/logic/`, and the adapter hands it
      the translated values. If it knows no module's types and only wraps a technology (YAML, TOML, the interpreter),
      it belongs in `platform/`.
    may_import: [ports, domain, kernel, kernel-logic, profile-values, platform, contract@any]
    must_import: [platform, contract@any]
    libraries: [ast, tokenize]
    forbidden: ambient
    holds: classes
    built_by: [bootstrap]
    tier: unit

  platform:
    path: platform
    role: "the filesystem, the package data, the readers of TOML, YAML and JSON, the YAML writer, and what the interpreter
      running xarch knows of its language"
    litmus: >-
      Is it a client or reader for a technology xarch uses (the filesystem, the package data, TOML, YAML, JSON, the
      interpreter running xarch) that knows none of any module's types? If yes, it goes here, named for the
      technology. If it translates a module's types for a port, it belongs in that module's `adapters/`. Which folder
      a relative path is read from is its caller's to say: a method that makes a path whole or walks the folders above
      it refuses a path not given in full.
    may_import: [kernel, kernel-logic]
    libraries: [yaml]
    tier: unit

  cli:
    path: cli
    role: the only place for commands and terminal output
    litmus: >-
      Does it parse arguments, call controllers, and print what `reports/` words, whichever module's data it shows? If
      yes, it goes here. If it computes a value out of one module's Result for another, merges two Results into one,
      or decodes the conventions of a Result, that belongs in a module's service. Passing a field of one Result
      unchanged into another module's command, or showing two Results side by side, is the cli's. If it chooses words,
      it belongs in `reports/`. If it holds a business rule, it belongs in a module.
    may_import: [reports, controller@any, contract@any, kernel, kernel-logic]
    libraries: [typer]
    tier: wired
    folders: [commands]

  reports:
    path: cli/reports
    role: formatting of Results into text and JSON
    litmus: >-
      Does it only put into text or JSON what a Result already says, choosing the words, the counts and the layout,
      and deciding nothing the Result does not hold?
    may_import: [contract@any, kernel, kernel-logic]
    forbidden: pure
    holds: functions
    immutable: true
    tier: unit

  main:
    path: __main__.py
    role: "`python -m xarch`: starts the same app as the console script"
    litmus: Does it only hand control to the app bootstrap/ builds, so that `python -m xarch` runs it?
    may_import: [bootstrap]
    untested: >-
      a two-line shim that runs the app bootstrap/ builds; no test runs `python -m xarch`, and the wired tests drive
      that same app

  bootstrap:
    path: bootstrap
    role: "composition root: binds ports to adapters, hands controllers to cli/"
    litmus: >-
      Does it choose which adapter fills which port, build the services and controllers around them, and hand one
      module's controller to the adapter of another module that wraps it? If yes, it goes here, and nowhere else. A
      class that implements a port, even against another module's controller, is an adapter and belongs in
      `adapters/`. If it decides a rule, it belongs in a module.
    may_import: everything
    tier: wired
    folders: [migrations]

  contract:
    path: modules/<module>/contract
    role: "the module's published language: commands, Results"
    litmus: >-
      Is it part of what the module promises callers outside it: a command a caller sends, a Result that comes back,
      or an id? If yes, it goes here, typed in full, with no field of an opaque type. A value with nothing to reshape
      is listed in `domain/published.py`, or is a value of `profile_values/`, and is re-exported here; everything else
      the module hands out is a type of its own here. If it is a domain value, a service type or a port, it stays where it is, and a type of the contract
      goes here instead.
    may_import: ["domain/values:*Id", "domain/published", kernel, kernel-logic, profile-values]
    forbidden: published
    tier: integration
    package_only: true

  profile-values:
    path: profile_values
    role: the values a profile and the data file of the language it names say, which spec builds and rules reads in full
    litmus: >-
      Is it a value that a profile, or the data file of the language it names, says, which spec builds and rules reads
      in full, field by field? If yes, it goes here, as a record with no rule beyond its own invariants. What a rule of
      `kernel/logic/` grades of such values (a key's shortfall of the facts a language supplies), which spec and rules
      both read in full, goes here too. If it is what a use case of one module found, it is that module's Result, in
      its `contract/`. If rules reads less than all of it, spec hands it out in its contract and rules holds a smaller
      value of its own. If only one module needs it, it belongs in that module's `domain/`. If it has no business
      meaning, one that could be lifted unchanged into an unrelated system, it belongs in `kernel/`.
    may_import: [kernel]
    shared: 2
    holds: classes
    forbidden: pure
    tier: unit

  kernel-logic:
    path: kernel/logic
    role: "pure functions that modules share, including a rule two modules need, over the values of kernel/ and
      profile_values/: no type of its own"
    litmus: >-
      Is it a pure function with no port and no I/O, over `kernel/` primitives and `profile_values/` values, deciding
      a rule that two or more modules need (where a path sits, what a target reaches, which facts fall short)? If yes,
      it goes here, in a file named for the rule, and every record it returns is immutable. If only one module needs
      it, it belongs in that module's `application/logic/`. If it is a value or a type rather than a function, it
      belongs in `kernel/`, or in `profile_values/` when it has business meaning.
    may_import: [kernel, profile-values]
    shared: 2
    forbidden: pure
    holds: functions
    immutable: true
    tier: unit

  kernel:
    path: kernel
    role: "pure primitives that modules share, with no business meaning; and xarch's catalogue of check ids, which a
      violation names"
    litmus: >-
      Is it a primitive with no business meaning, one that could be lifted unchanged into an unrelated system, such as
      the base error or a finding at a place in a file tree? If yes, it goes here. One exception, named on purpose:
      `RULES` and `OWN_ID`, xarch's catalogue of check ids and how a profile writes its own, stay here beside the
      `Violation` that validates them, because spec and rules both need them and spec cannot import rules. If it is a
      value of the profile or of the language a check reads, it belongs in `profile_values/`. If it is a pure function
      two modules need, it goes in `kernel/logic/`. If one module needs it, it belongs in that module.
    shared: 2
    forbidden: pure
    holds: classes
    tier: unit

forbidden:
  pure: [datetime.datetime.now, datetime.datetime.utcnow, datetime.datetime.today, datetime.date.today, time.time,
         time.time_ns, time.monotonic, time.perf_counter, builtins.open, builtins.print, builtins.input, sys.stdin,
         sys.stdout, sys.stderr, os.environ, os.getenv, socket, subprocess, sqlite3, urllib, http, shutil,
         pathlib.Path.cwd, pathlib.Path.absolute, os.getcwd, os.path.abspath, os.path.realpath, pathlib.Path.resolve,
         pathlib.Path.home, pathlib.Path.expanduser, os.path.expanduser, os.getcwdb, os.chdir]
  published: [datetime.datetime.now, datetime.datetime.utcnow, datetime.datetime.today, datetime.date.today,
              time.time, time.time_ns, time.monotonic, time.perf_counter, builtins.open, builtins.print,
              builtins.input, sys.stdin, sys.stdout, sys.stderr, os.environ, os.getenv, socket, subprocess, sqlite3,
              urllib, http, shutil, pathlib.Path.cwd, pathlib.Path.absolute, os.getcwd, os.path.abspath,
              os.path.realpath, pathlib.Path.resolve, pathlib.Path.home, pathlib.Path.expanduser, os.path.expanduser,
              os.getcwdb, os.chdir, typing.Any]
  ambient: [pathlib.Path.cwd, pathlib.Path.absolute, pathlib.Path.resolve, pathlib.Path.home, pathlib.Path.expanduser,
            os.getcwd, os.getcwdb, os.chdir, os.path.abspath, os.path.realpath, os.path.expanduser, .absolute(),
            .resolve(), .expanduser(), .chdir()]

reserved:
  ast: only the reader adapter parses the checked language, so that another language needs one new reader
  tokenize: only the reader adapter reads the checked language's tokens

tiers:
  unit:
    proves: a pure rule of the kernel or a module, or an adapter's translation
    litmus: Does it call one part's own code directly, with nothing wired, and check its answer?
    apply_forbidden: true
    plain_tables: true
    docs:
      may_touch: what the part it mirrors may import; an adapter, temporary folders

  integration:
    proves: a use case, through its controller around fakes
    litmus: Does it drive a controller around fakes and check the Result it returns?
    apply_forbidden: true
    plain_tables: true
    must_import: [controller]
    # domain/values: the values the ports hand back, which a test of a controller builds its fakes' answers with
    may_also_import: [domain/values]
    docs:
      may_touch: what the part it mirrors may import; `tests/fakes/`

  wired:
    proves: a command, a check on real files, or what a bundled profile holds, through the app bootstrap/ wires
    litmus: Does it need the whole app, as bootstrap/ wires it, to mean anything?
    types_only: [domain, logic, ports, services, controller, adapters, platform]
    must_import: [bootstrap]
    docs:
      may_touch: anything bootstrap/ wires; temporary folders

  guard:
    proves: xarch follows the architecture it enforces
    litmus: Does it run the wired check on xarch's own source?
    types_only: [domain, logic, ports, services, controller, adapters, platform]
    folder: architecture
    may_import: everything
    docs:
      subject: xarch's own source tree
      may_touch: "`tests/architecture/`"

fakes:
  folder: fakes
  for: [ports]
  prefix: Fake

guards:
  scenario-coverage:
    results: contract
    tier: integration
    suffix: Result
    columns: [given, when, then]
    file: test_{name}.py
  no-comments: {}
  closed-tree: {}
  stand-ins: {}
  no-duplicates: {min_statements: 4}
  no-twins: {min_fields: 2, min_renamed: 3, min_subset: 3, translated: [adapters]}
  dead-code:
    untested: true
    tests_only: true
    known: [bootstrap/wiring.py:build_architectures, bootstrap/wiring.py:load_architecture]
  pass-through: {parts: [services, controller, adapters]}
  private-imports: {}

excluded:
  architectures/examples: >-
    the example projects the bundled profiles ship as data, which their docs show; sources that xarch never imports or
    runs, so they are not part of its own code

docs:
  entry: cli
