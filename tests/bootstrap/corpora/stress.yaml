name: stress
based_on: cli
language: python
testing: pytest
parts:
  modules/<module>/:
    domain/:
      role: "entities, values, errors: invariants only"
      imports:
        may: [kernel]
      uses:
        never: pure
      holds:
        classes:
          built_by: [bootstrap, adapters]
      package_only: true
      tests: unit
    application/:
      logic/:
        role: pure functions over the module's domain objects
        imports:
          may: [domain, kernel]
        uses:
          never: pure
        holds:
          functions: {}
          records: {}
          exceptions: {}
        package_only: true
        tests: unit
      ports/:
        role: Protocols for what the module needs from the outside
        imports:
          may: [domain, kernel]
        uses:
          never: pure
        holds:
          classes: {}
        package_only: true
        tests: integration
      services/:
        role: "use-case steps: load, check, act"
        imports:
          may:
            - logic
            - domain
            - ports
            - contract: types_only
            - kernel
          must: [ports]
        uses:
          never: ambient
        holds:
          classes:
            names: "*Service"
            built_by: [bootstrap]
        tests: integration
      controller.py:
        role: maps failures to a Result
        imports:
          may: [services, logic, domain, ports, contract, kernel]
        uses:
          never: ambient
        holds:
          classes:
            names: "*Controller"
            built_by: [bootstrap]
        tests: integration
    adapters/:
      role: implement the ports on the filesystem or another module's contract
      imports:
        may:
          - ports
          - domain: types_only
          - kernel
          - platform
          - contract@any
        must: [platform, contract@any]
        libraries: [ast, tokenize]
      uses:
        never: pure
      holds:
        classes:
          built_by: [bootstrap]
          names: Fs*
      tests: unit
    contract/:
      role: "the module's published language: commands, Results"
      imports:
        may: ["domain/values:*Id", kernel]
      uses:
        never: pure
      package_only: true
      tests: integration
  platform/:
    role: "the filesystem, the package data, the TOML and YAML readers and the YAML writer"
    imports:
      may: [kernel]
      libraries: [yaml]
    holds:
      functions: {}
      records:
        names: "*Reader"
      exceptions:
        names: "*Reader"
    tests: unit
  cli/:
    role: the only place for commands and terminal output
    imports:
      may: [reports, controller@any, contract@any, kernel]
      libraries: [typer, json]
    uses:
      never: ambient
    tests: wired
    commands/: {}
    reports/:
      role: formatting of Results into text and JSON
      imports:
        may: [contract@any, kernel]
        libraries: []
      uses:
        never: pure
      holds:
        functions: {}
        records: {}
        exceptions: {}
      tests: unit
  __main__.py:
    name: main
    role: "`python -m xarch`: starts the same app as the console script"
    litmus: "Does it only hand control to the app bootstrap/ builds, so that `python -m xarch` runs it?"
    imports:
      may: [bootstrap]
    untested: >-
      a two-line shim that runs the app bootstrap/ builds; no test runs `python -m xarch`, and the wired tests drive
      that same app
  bootstrap/:
    role: "composition root: binds ports to adapters, hands controllers to cli/"
    imports:
      may: everything
    tests: wired
    migrations/: {}
  kernel/:
    role: pure primitives and the rules two modules share
    uses:
      never: pure
    holds:
      classes: {}
    tests: unit
    logic/: {}
never:
  pure:
  - datetime.datetime.now
  - datetime.datetime.utcnow
  - datetime.datetime.today
  - datetime.date.today
  - time.time
  - time.time_ns
  - time.monotonic
  - time.perf_counter
  - builtins.open
  - builtins.print
  - builtins.input
  - sys.stdin
  - sys.stdout
  - sys.stderr
  - os.environ
  - os.getenv
  - socket
  - subprocess
  - sqlite3
  - urllib
  - http
  - shutil
  - pathlib.Path.cwd
  - pathlib.Path.absolute
  - os.getcwd
  - os.path.abspath
  - os.path.realpath
  - pathlib.Path.resolve
  - pathlib.Path.home
  - pathlib.Path.expanduser
  - os.path.expanduser
  - os.getcwdb
  - os.chdir
  ambient:
  - pathlib.Path.cwd
  - pathlib.Path.absolute
  - pathlib.Path.resolve
  - pathlib.Path.home
  - pathlib.Path.expanduser
  - os.getcwd
  - os.getcwdb
  - os.chdir
  - os.path.abspath
  - os.path.realpath
  - os.path.expanduser
  - .absolute()
  - .resolve()
  - .expanduser()
reserved:
  ast: only the reader adapter parses the checked language, so that another language needs one new reader
  tokenize: only the reader adapter reads the checked language's tokens
  json: only the reports write JSON
  re: only the spec reads patterns
tiers:
  unit:
    proves: a pure rule of the kernel or a module, or an adapter's translation
    litmus: Does it call one part's own code directly, with nothing wired, and check its answer?
    uses: {apply_never: true}
    docs:
      may_touch: what the part it mirrors may import; an adapter, temporary folders
    imports:
      must:
      - domain
      - logic
      - kernel
      types_only:
      - domain
  integration:
    proves: a use case, through its controller around fakes
    litmus: Does it drive a controller around fakes and check the Result it returns?
    imports:
      must:
      - controller
    docs:
      may_touch: what the part it mirrors may import; `tests/fakes/`
    uses: {apply_never: true}
  wired:
    proves: a command, a check on real files, or what a bundled profile holds, through the app bootstrap/ wires
    litmus: Does it need the whole app, as bootstrap/ wires it, to mean anything?
    imports:
      must:
      - bootstrap
      types_only:
      - domain
      - logic
      - ports
      - services
      - controller
      - adapters
      - platform
    docs:
      may_touch: anything bootstrap/ wires; temporary folders
    uses: {apply_never: true}
  guard:
    proves: xarch follows the architecture it enforces
    litmus: Does it run the wired check on xarch's own source?
    imports:
      may: everything
      types_only:
      - domain
      - logic
      - ports
      - services
      - controller
      - adapters
      - platform
    folder: architecture
    docs:
      subject: xarch's own source tree
      may_touch: '`tests/architecture/`'
fakes:
  folder: fakes
  for:
  - ports
  prefix: Fake
guards:
  scenario-coverage:
    results: contract
    tier: integration
    suffix: Result
    columns:
    - given
    - when
    - then
    file: test_{name:snake}.py
  no-comments: {}
  closed-tree: {}
  stand-ins: {}
  no-duplicates:
    min_statements: 2
  no-twins:
    min_fields: 1
  dead-code:
    untested: true
  pass-through:
    parts:
    - services
    - controller
    - adapters
    - cli
    - reports
    - platform
  no-callbacks: {parts: [domain, logic, services, controller]}
  private-imports: {}
docs:
  entry: cli
