# The architecture xarch itself follows: the cli profile, with the packages xarch uses and the tests it has.
name: xarch
based_on: cli
language: python
testing: pytest

parts:
  modules/<module>/:
    domain/:
      role: "entities, values, errors: invariants only"
      imports:
        may: [kernel]
      uses:
        never: pure
      holds:
        classes: {}
      tests: unit
    application/:
      logic/:
        role: pure functions over the module's domain objects
        imports:
          may: [domain, kernel]
        uses:
          never: pure
        holds:
          functions: {}
          records: {}
          exceptions: {}
        tests: unit
      ports/:
        role: Protocols for what the module needs from the outside
        imports:
          may: [domain, kernel]
        uses:
          never: pure
        holds:
          classes: {}
        tests: integration
      services/:
        role: "use-case steps: load, check, act"
        imports:
          may:
            - logic
            - domain
            - ports
            - contract: types_only
            - kernel
        holds:
          classes:
            names: "*Service"
            built_by: [bootstrap]
        tests: integration
      controller.py:
        role: maps failures to a Result
        imports:
          may: [services, logic, domain, ports, contract, kernel]
        holds:
          classes:
            names: "*Controller"
            built_by: [bootstrap]
        tests: integration
    adapters/:
      role: implement the ports on the filesystem or another module's contract
      imports:
        may: [ports, domain, kernel, platform, contract@any]
        must: [platform, contract@any]
      holds:
        classes:
          built_by: [bootstrap]
      tests: unit
    contract/:
      role: "the module's published language: commands, Results"
      imports:
        may: ["domain/values:*Id", kernel]
      uses:
        never: pure
      package_only: true
      tests: integration
  platform/:
    role: "the filesystem, TOML and YAML readers"
    imports:
      may: [kernel]
      libraries: [yaml]
    untested: "it wraps the standard library and yaml; the adapter and wired tests reach it on real files"
  cli/:
    role: the only place for commands and terminal output
    imports:
      may: [controller@any, contract@any, kernel]
      libraries: [typer]
    tests: wired
    commands/: {}
  __main__.py:
    name: main
    role: "`python -m xarch`: starts the same app as the console script"
    litmus: "Does it only hand control to the app bootstrap/ builds, so that `python -m xarch` runs it?"
    imports:
      may: [bootstrap]
    untested: >-
      a two-line shim that runs the app bootstrap/ builds; no test runs `python -m xarch`, and the wired tests drive
      that same app
  bootstrap/:
    role: "composition root: binds ports to adapters, hands controllers to cli/"
    imports:
      may: everything
    tests: wired
    migrations/: {}
  kernel/:
    role: pure primitives and the rules two modules share
    uses:
      never: pure
    tests: unit
    logic/: {}

never:
  pure: [datetime.datetime.now, datetime.datetime.utcnow, datetime.datetime.today, datetime.date.today, time.time,
         time.time_ns, time.monotonic, time.perf_counter, builtins.open, builtins.print, builtins.input, sys.stdin,
         sys.stdout, sys.stderr, os.environ, os.getenv, socket, subprocess, sqlite3, urllib, http, shutil,
         pathlib.Path.cwd, pathlib.Path.absolute, os.getcwd, os.path.abspath, os.path.realpath]

tiers:
  unit:
    proves: a pure rule of the kernel or a module, or an adapter's translation
    litmus: Does it call one part's own code directly, with nothing wired, and check its answer?
    uses: {apply_never: true}
    docs:
      may_touch: what the part it mirrors may import; an adapter, temporary folders

  integration:
    proves: a use case, through its controller around fakes
    litmus: Does it drive a controller around fakes and check the Result it returns?
    imports:
      must: [controller]
    docs:
      may_touch: what the part it mirrors may import; `tests/fakes/`

  wired:
    proves: a command, a check on real files, or what a bundled profile holds, through the app bootstrap/ wires
    litmus: Does it need the whole app, as bootstrap/ wires it, to mean anything?
    imports:
      must: [bootstrap]
      types_only: [domain, logic, ports, services, controller, adapters, platform]
    docs:
      may_touch: anything bootstrap/ wires; temporary folders

  guard:
    proves: xarch follows the architecture it enforces
    litmus: Does it run the wired check on xarch's own source?
    imports:
      may: everything
      types_only: [domain, logic, ports, services, controller, adapters, platform]
    folder: architecture
    docs:
      subject: xarch's own source tree
      may_touch: "`tests/architecture/`"

fakes:
  folder: fakes
  for: [ports]
  prefix: Fake

guards:
  scenario-coverage:
    results: contract
    tier: integration
    suffix: Result
    columns: [given, when, then]
    file: test_{name:snake}.py
  no-comments: {}
  closed-tree: {}
  stand-ins: {}
  no-duplicates: {min_statements: 4}
  dead-code: {untested: true}
  pass-through: {parts: [services, controller, adapters]}
  no-callbacks: {parts: [domain, logic]}
  private-imports: {}

excluded:
  architectures/examples: >-
    the example projects the bundled profiles ship as data, which their docs show; sources that xarch never imports or
    runs, so they are not part of its own code

docs:
  entry: cli
