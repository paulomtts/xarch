# A test-only framework that imitates Vitest-like tests: no profile names it and no reader reads it. It writes two
# forms of a table, a loop of the test's body over a list literal (index 0) and a call that wraps the test (index 1),
# both with literal rows. The tests load it to show that the checks word a table by its form's slots and the
# language's writing, never by a framework's own syntax.
files: ["*.test.ts"]
functions: "test*"
tables:
  - loop: true
    columns_from: bound
    row: literal
    id: {position: 0}
  - call: ["vitest#it.each", "vitest#test.each"]
    rows: {position: 0}
    columns_from: fields
    row: literal
    id: {field: name}
