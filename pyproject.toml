[project]
name = "xarch"
version = "0.2.0"
description = "Scaffold and check the architecture a profile file describes, for coding agents and people"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Paulo Mattos Ferreira de Azevedo e Menezes", email = "paulomtts@outlook.com" }
]
requires-python = ">=3.13"
keywords = ["architecture", "scaffolding", "linter", "static-analysis", "coding-agents", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.urls]
Repository = "https://github.com/paulomtts/xarch"
Issues = "https://github.com/paulomtts/xarch/issues"

[project.scripts]
xarch = "xarch.bootstrap.app:app"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.5",
]

[tool.uv.build-backend]
module-root = ""

[tool.xarch]
profile = "architecture.yaml"
app = "xarch"

[tool.pytest.ini_options]
testpaths = ["tests"]
