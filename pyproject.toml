[project]
name = "xarch"
version = "0.1.0"
description = "Check and scaffold the architecture in docs/project/architecture.md"
readme = "README.md"
authors = [
    { name = "Paulo Mattos Ferreira de Azevedo e Menezes", email = "paulomtts@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
xarch = "xarch.bootstrap.app:app"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.build-backend]
module-root = ""
